<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lake Erie Trophy Angler</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- TOP UI & TACKLE SELECTOR --- */
        #top-bar {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(0, 20, 30, 0.75);
            border: 1px solid rgba(0, 220, 255, 0.4);
            border-radius: 6px;
            padding: 8px 12px;
            color: #00e1ff;
            font-size: 11px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }

        .hud-panel select {
            background: #001520;
            color: #00e1ff;
            border: 1px solid #00e1ff;
            font-family: inherit;
            font-size: 11px;
            padding: 2px 4px;
            border-radius: 3px;
            outline: none;
        }

        /* --- GPS CONTOUR MINIMAP (BOTTOM LEFT) --- */
        #gps-unit {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 130px;
            height: 130px;
            background: rgba(5, 20, 10, 0.85);
            border: 2px solid #00ff66;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,255,102,0.2);
            overflow: hidden;
            z-index: 10;
        }

        #gps-canvas {
            width: 100%;
            height: 100%;
        }

        /* --- REALISTIC MONOCHROME LCD SONAR (TOP RIGHT) --- */
        #sonar-unit {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 210px;
            background: #111;
            border: 3px solid #333;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
            padding: 6px;
            z-index: 10;
        }

        #sonar-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 9px;
            color: #888;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        #sonar-screen-container {
            position: relative;
            width: 100%;
            height: 120px;
            background-color: #829f82; /* Retro LCD Olive Base */
            border: 2px solid #222;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        #sonar-screen-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(0,0,0,0.05) 50%, rgba(255,255,255,0.05) 50%),
                        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100% 4px, 20px 100%;
            pointer-events: none;
        }

        #sonar-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #sonar-readouts {
            position: absolute;
            top: 4px;
            left: 6px;
            font-family: monospace;
            font-weight: bold;
            color: #0f1c0f;
            pointer-events: none;
            font-size: 10px;
            line-height: 1.1;
        }

        #sonar-readouts span {
            font-size: 16px;
        }

        /* --- TRANSLUCENT OVERLAY CONTROLS --- */
        
        /* Left Joystick (Center Left above Minimap) */
        #joystick-container {
            position: absolute;
            bottom: 170px;
            left: 25px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            backdrop-filter: blur(4px);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #joystick-stick {
            position: absolute;
            width: 46px;
            height: 46px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Right Action Controls */
        #controls-right {
            position: absolute;
            bottom: 40px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            z-index: 20;
        }

        .action-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
        }

        .action-btn:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.93);
        }

        .action-btn span {
            font-size: 8px;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Status Center Text */
        #game-status {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
            font-size: 16px;
            font-weight: bold;
            pointer-events: none;
            text-align: center;
            z-index: 10;
            background: rgba(0,0,0,0.4);
            padding: 6px 16px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="renderCanvas"></canvas>

    <!-- STATUS HUD -->
    <div id="game-status">MODE: NAVIGATION</div>

    <!-- TACKLE HUD -->
    <div id="top-bar">
        <div class="hud-panel">
            Lure: 
            <select id="lure-select">
                <option value="Skitter Walk">Skitter Walk (Topwater)</option>
                <option value="Husky Jerk">Husky Jerk (Mid)</option>
                <option value="Shad Rap" selected>Shad Rap (Deep)</option>
                <option value="DT-10">DT-10 (Structure)</option>
            </select>
        </div>
        <div class="hud-panel">
            Live Bait: 
            <select id="bait-select">
                <option value="None">None</option>
                <option value="Shiner">Emerald Shiner</option>
                <option value="Nightcrawler">Nightcrawler</option>
            </select>
        </div>
    </div>

    <!-- LCD SONAR UNIT -->
    <div id="sonar-unit">
        <div id="sonar-header">
            <span>ErieSonar 2000</span>
            <span>200 kHz</span>
        </div>
        <div id="sonar-screen-container">
            <canvas id="sonar-canvas" width="200" height="120"></canvas>
            <div id="sonar-readouts">
                DEPTH<br>
                <span id="sonar-depth">24.5</span><small>FT</small>
            </div>
        </div>
    </div>

    <!-- GPS MINIMAP -->
    <div id="gps-unit">
        <canvas id="gps-canvas" width="130" height="130"></canvas>
    </div>

    <!-- TRANSLUCENT JOYSTICK -->
    <div id="joystick-container">
        <div id="joystick-stick"></div>
    </div>

    <!-- RIGHT ACTION BUTTONS -->
    <div id="controls-right">
        <button class="action-btn" id="btn-reel">
            REEL
            <span>(TAP)</span>
        </button>
        <button class="action-btn" id="btn-action">
            CAST
            <span>LINE</span>
        </button>
    </div>
</div>

<script>
    const canvas = document.getElementById('renderCanvas');
    const ctx = canvas.getContext('2d');
    const sonarCanvas = document.getElementById('sonar-canvas');
    const sonarCtx = sonarCanvas.getContext('2d');
    const gpsCanvas = document.getElementById('gps-canvas');
    const gpsCtx = gpsCanvas.getContext('2d');
    
    const statusEl = document.getElementById('game-status');
    const depthEl = document.getElementById('sonar-depth');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- GAME STATE ---
    const STATE = { NAV: 0, CASTING: 1, WAITING: 2, REELING: 3, CAUGHT: 4 };
    let currentState = STATE.NAV;

    let boat = { x: 500, z: 500, angle: 0, speed: 0 };
    let inputVector = { x: 0, y: 0 };
    let keys = {};

    let depth = 24.5;
    let lineTension = 20;
    let fishDistance = 100;
    let rodAngle = 0; // -1 (Left) to 1 (Right)
    let fishPullDir = -1;
    let targetSpecies = "Walleye";

    // --- SONAR HISTORY BUFFERS ---
    const sonarWidth = sonarCanvas.width;
    const sonarHeight = sonarCanvas.height;
    let depthHistory = new Array(sonarWidth).fill(60);
    let fishArches = [];

    // --- KEYBOARD CONTROLS (SUPPORTED ALONGSIDE JOYSTICK) ---
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (e.code === 'Space') handleMainAction();
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // --- TRANSLUCENT JOYSTICK LOGIC ---
    const joyContainer = document.getElementById('joystick-container');
    const joyStick = document.getElementById('joystick-stick');
    let joyActive = false;
    let joyTouchId = null;
    const joyRadius = 40;

    function handleJoyMove(clientX, clientY) {
        const rect = joyContainer.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        let dx = clientX - centerX;
        let dy = clientY - centerY;
        let dist = Math.hypot(dx, dy);

        if (dist > joyRadius) {
            dx = (dx / dist) * joyRadius;
            dy = (dy / dist) * joyRadius;
        }

        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        inputVector.x = dx / joyRadius;
        inputVector.y = dy / joyRadius;
    }

    function resetJoystick() {
        joyActive = false;
        joyTouchId = null;
        joyStick.style.transform = `translate(0px, 0px)`;
        inputVector.x = 0;
        inputVector.y = 0;
    }

    joyContainer.addEventListener('pointerdown', (e) => {
        joyActive = true;
        joyTouchId = e.pointerId;
        joyContainer.setPointerCapture(e.pointerId);
        handleJoyMove(e.clientX, e.clientY);
    });

    joyContainer.addEventListener('pointermove', (e) => {
        if (joyActive && e.pointerId === joyTouchId) {
            handleJoyMove(e.clientX, e.clientY);
        }
    });

    joyContainer.addEventListener('pointerup', resetJoystick);
    joyContainer.addEventListener('pointercancel', resetJoystick);

    // --- BUTTON ACTIONS ---
    const btnReel = document.getElementById('btn-reel');
    const btnAction = document.getElementById('btn-action');

    btnReel.addEventListener('click', () => {
        if (currentState === STATE.REELING) {
            // Tap to reel mechanic
            fishDistance = Math.max(0, fishDistance - 3.5);
            lineTension = Math.min(100, lineTension + 10);
        }
    });

    function handleMainAction() {
        if (currentState === STATE.NAV) {
            currentState = STATE.WAITING;
            statusEl.innerText = "LINE CAST! WAITING FOR STRIKE...";
            btnAction.innerHTML = "SET<span>HOOK</span>";
            
            setTimeout(() => {
                if (currentState === STATE.WAITING) {
                    currentState = STATE.REELING;
                    fishDistance = 90;
                    lineTension = 30;
                    fishPullDir = Math.random() < 0.5 ? -1 : 1;
                    const lures = ["Walleye", "Smallmouth Bass", "Yellow Perch", "Trophy Steelhead"];
                    targetSpecies = lures[Math.floor(Math.random() * lures.length)];
                    statusEl.innerText = `STRIKE! HOOKED A ${targetSpecies.toUpperCase()}!`;
                    btnAction.innerHTML = "LAND<span>FISH</span>";
                }
            }, 2500 + Math.random() * 2000);
        } else if (currentState === STATE.REELING && fishDistance <= 0) {
            currentState = STATE.CAUGHT;
            statusEl.innerText = `CAUGHT 12.4 lb ${targetSpecies}! CLICK TO RESUME`;
            btnAction.innerHTML = "CAST<span>LINE</span>";
        } else if (currentState === STATE.CAUGHT) {
            currentState = STATE.NAV;
            statusEl.innerText = "MODE: NAVIGATION";
        }
    }

    btnAction.addEventListener('click', handleMainAction);

    // --- SONAR ENGINE ---
    function updateSonar() {
        depth = 15 + Math.sin(boat.x * 0.02) * 10 + Math.cos(boat.z * 0.02) * 8;
        depthEl.innerText = depth.toFixed(1);

        depthHistory.shift();
        const bottomY = Math.min(sonarHeight - 8, (depth / 40) * sonarHeight);
        depthHistory.push(bottomY);

        fishArches.forEach(f => f.x -= 1);
        fishArches = fishArches.filter(f => f.x > -20);

        if (Math.random() < 0.05) {
            fishArches.push({
                x: sonarWidth + 10,
                y: 20 + Math.random() * (bottomY - 30),
                size: 5 + Math.random() * 6
            });
        }

        sonarCtx.fillStyle = '#829f82'; 
        sonarCtx.fillRect(0, 0, sonarWidth, sonarHeight);

        sonarCtx.fillStyle = '#1c2d1c';
        sonarCtx.beginPath();
        sonarCtx.moveTo(0, sonarHeight);
        for (let x = 0; x < sonarWidth; x++) {
            sonarCtx.lineTo(x, depthHistory[x]);
        }
        sonarCtx.lineTo(sonarWidth, sonarHeight);
        sonarCtx.fill();

        for (let x = 0; x < sonarWidth; x += 3) {
            const y = depthHistory[x];
            sonarCtx.fillRect(x, y, 1, sonarHeight - y);
        }

        sonarCtx.lineWidth = 2;
        sonarCtx.strokeStyle = '#1c2d1c';
        fishArches.forEach(f => {
            sonarCtx.beginPath();
            sonarCtx.arc(f.x, f.y + f.size, f.size, Math.PI * 1.2, Math.PI * 1.8);
            sonarCtx.stroke();
        });
    }

    // --- GPS CONTOUR MINIMAP ENGINE ---
    function updateGPS() {
        gpsCtx.fillStyle = '#05140a';
        gpsCtx.fillRect(0, 0, 130, 130);

        // Draw Depth Contours
        gpsCtx.strokeStyle = 'rgba(0, 255, 102, 0.25)';
        gpsCtx.lineWidth = 1;
        for (let r = 20; r < 120; r += 20) {
            gpsCtx.beginPath();
            gpsCtx.arc(65, 65, r, 0, Math.PI * 2);
            gpsCtx.stroke();
        }

        // Draw Boat Marker
        gpsCtx.save();
        gpsCtx.translate(65, 65);
        gpsCtx.rotate(boat.angle);
        gpsCtx.fillStyle = '#00ff66';
        gpsCtx.beginPath();
        gpsCtx.moveTo(0, -6);
        gpsCtx.lineTo(5, 6);
        gpsCtx.lineTo(-5, 6);
        gpsCtx.closePath();
        gpsCtx.fill();
        gpsCtx.restore();
    }

    // --- MAIN RENDER & GAME LOOP ---
    function gameLoop() {
        // 1. Process Steering & Movement Inputs
        let moveY = -inputVector.y;
        let moveX = inputVector.x;

        if (keys['w'] || keys['arrowup']) moveY = 1;
        if (keys['s'] || keys['arrowdown']) moveY = -1;
        if (keys['a'] || keys['arrowleft']) moveX = -1;
        if (keys['d'] || keys['arrowright']) moveX = 1;

        if (currentState === STATE.NAV) {
            boat.speed = moveY * 1.2;
            boat.angle += moveX * 0.04;
            boat.x += Math.sin(boat.angle) * boat.speed;
            boat.z += Math.cos(boat.angle) * boat.speed;
        }

        // 2. Underwater Reeling Battle Physics
        if (currentState === STATE.REELING) {
            // Adjust Rod Counter-Steering
            if (moveX !== 0) {
                rodAngle = Math.max(-1, Math.min(1, rodAngle + moveX * 0.08));
            } else {
                rodAngle *= 0.9;
            }

            // Fish randomly changes pull direction
            if (Math.random() < 0.02) fishPullDir *= -1;

            // If counter-steering against pull, reduce tension; otherwise build tension
            let fightingCorrectly = (fishPullDir < 0 && rodAngle > 0.2) || (fishPullDir > 0 && rodAngle < -0.2);
            lineTension += fightingCorrectly ? -0.2 : 0.4;

            // Passive decay
            lineTension = Math.max(0, lineTension - 0.2);

            // Line Snap Check
            if (lineTension >= 100) {
                currentState = STATE.NAV;
                statusEl.innerText = "LINE SNAPPED! FISH GOT AWAY!";
                btnAction.innerHTML = "CAST<span>LINE</span>";
            }
        }

        // 3. Render Views
        if (currentState === STATE.REELING) {
            // --- UNDERWATER REELING BATTLE CAMERA ---
            ctx.fillStyle = '#002b36'; // Deep Underwater Tint
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun Rays Effect
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.moveTo(canvas.width * 0.2 * i, 0);
                ctx.lineTo(canvas.width * 0.2 * i + 100, canvas.height);
                ctx.lineTo(canvas.width * 0.2 * i + 40, canvas.height);
                ctx.fill();
            }

            // Draw Fish Target
            let fishX = canvas.width / 2 + (fishPullDir * (100 - fishDistance) * 2);
            let fishY = canvas.height / 2 + Math.sin(Date.now() * 0.005) * 20;
            let fishSize = Math.max(15, 60 - fishDistance * 0.4);

            ctx.fillStyle = '#2aa198';
            ctx.beginPath();
            ctx.ellipse(fishX, fishY, fishSize, fishSize * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Fishing Line
            ctx.strokeStyle = lineTension > 75 ? '#d33682' : '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2 + rodAngle * 150, canvas.height);
            ctx.lineTo(fishX, fishY);
            ctx.stroke();

            // Tension Meter UI
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(canvas.width / 2 - 100, canvas.height - 70, 200, 16);
            ctx.fillStyle = lineTension > 80 ? '#dc322f' : '#859900';
            ctx.fillRect(canvas.width / 2 - 100, canvas.height - 70, lineTension * 2, 16);

            ctx.fillStyle = '#fff';
            ctx.font = '11px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`LINE TENSION | FISH DISTANCE: ${Math.round(fishDistance)}FT`, canvas.width / 2, canvas.height - 80);

        } else {
            // --- FIRST-PERSON BOAT NAVIGATION VIEW ---
            ctx.fillStyle = '#004b6e'; // Water
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#002b40'; // Sky
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.42);

            // Water horizon lines
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = canvas.height * 0.42; i < canvas.height; i += 18) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Boat Cockpit Nose
            ctx.fillStyle = '#111';
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.2, canvas.height);
            ctx.lineTo(canvas.width * 0.5, canvas.height * 0.7);
            ctx.lineTo(canvas.width * 0.8, canvas.height);
            ctx.fill();
        }

        updateSonar();
        updateGPS();

        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
