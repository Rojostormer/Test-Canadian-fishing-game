<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lake Erie Trophy Angler — Underwater Battle</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;padding:0;background:#02090f;color:#fff;font-family:'Courier New',Courier,monospace;height:100%;overflow:hidden}
#gameContainer{position:relative;width:100vw;height:100vh;background:#000}
#viewCanvas{width:100%;height:100%;display:block}

/* Retro Game Overlays */
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-space-between;padding:12px;z-index:10}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start}
.brand h1{margin:0;font-size:20px;letter-spacing:2px;color:#00ffcc;text-shadow:0 0 8px rgba(0,255,204,0.6)}
.brand .sub{font-size:10px;color:#7a9cb0;font-weight:700}
.stats{text-align:right;font-size:12px;font-weight:700;color:#00ffcc;background:rgba(2,15,25,0.85);padding:6px 10px;border:2px solid #00ffcc;box-shadow:0 0 10px rgba(0,255,204,0.2)}

/* Sonar / Fish Finder */
.fish-finder{position:absolute;top:50px;right:12px;width:160px;height:140px;background:#001a00;border:3px solid #00ff00;box-shadow:0 0 12px rgba(0,255,0,0.4);pointer-events:auto;overflow:hidden;border-radius:4px}
.fish-finder-header{background:#003300;color:#00ff00;font-size:9px;text-align:center;padding:2px;font-weight:bold;letter-spacing:1px;border-bottom:1px solid #00ff00}
#sonarCanvas{width:100%;height:118px;display:block}

/* Lake Erie Map Display */
.map-display{position:absolute;top:50px;left:12px;width:160px;height:120px;background:#05131d;border:2px solid #00b4d8;pointer-events:auto;border-radius:4px}
.map-header{background:#0a2536;color:#00b4d8;font-size:9px;text-align:center;padding:2px;font-weight:bold}
#mapCanvas{width:100%;height:100px;display:block}

/* Line Tension Meter (Reeling Battle) */
.tension-meter-container{position:absolute;top:180px;right:12px;width:160px;background:rgba(2,15,25,0.9);border:2px solid #ffcc00;padding:6px;border-radius:4px;display:none;pointer-events:auto}
.tension-meter-label{font-size:9px;color:#ffcc00;text-align:center;font-weight:bold;margin-bottom:4px}
.tension-bar-bg{width:100%;height:16px;background:#111;border:1px solid #ffcc00;position:relative;overflow:hidden}
.tension-bar-fill{height:100%;width:0%;background:linear-gradient(90deg, #00ff00 0%, #ffff00 60%, #ff0000 100%);transition:width 0.1s}

.controls-panel{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;background:rgba(2,15,25,0.9);padding:10px;border:2px solid #00ffcc}
.btn{height:42px;padding:0 16px;border:2px solid #00ffcc;font-family:inherit;font-size:12px;font-weight:900;color:#00ffcc;background:#031826;cursor:pointer;box-shadow:0 0 8px rgba(0,255,204,0.3)}
.btn:active{background:#00ffcc;color:#000}
.btn.cast{border-color:#ff9900;color:#ff9900;box-shadow:0 0 8px rgba(255,153,0,0.3)}
.btn.cast:active{background:#ff9900;color:#000}

.tackle-selector{position:absolute;bottom:70px;left:12px;pointer-events:auto;background:rgba(2,15,25,0.85);padding:8px;border:1px solid #00ffcc;width:180px}
.tackle-selector label{font-size:9px;color:#00ffcc;display:block;margin-bottom:2px}
.tackle-selector select{width:100%;height:28px;background:#02090f;color:#fff;border:1px solid #00ffcc;font-family:inherit;font-size:11px;margin-bottom:6px}

.status-msg{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%);font-size:20px;font-weight:bold;color:#ffff00;text-shadow:2px 2px #000;pointer-events:none;opacity:0;transition:opacity 0.2s;text-align:center}
.status-msg.show{opacity:1}

.modal{position:absolute;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.hidden{display:none !important}
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="viewCanvas"></canvas>

  <div class="hud">
    <div class="top-bar">
      <div class="brand">
        <h1>LAKE ERIE ANGLER</h1>
        <div class="sub">RAPALA-STYLE PRO TOURNAMENT</div>
      </div>
      <div class="stats">
        CASH: $<span id="money">150</span> | FISH: <span id="caughtCount">0</span>
      </div>
    </div>

    <!-- Lake Erie Topographical GPS Map -->
    <div class="map-display" id="mapUI">
      <div class="map-header">LAKE ERIE GPS (DEPTH CONTOURS)</div>
      <canvas id="mapCanvas"></canvas>
    </div>

    <!-- Sonar / Fish Finder Unit -->
    <div class="fish-finder" id="sonarUI">
      <div class="fish-finder-header">SONAR FISH FINDER</div>
      <canvas id="sonarCanvas"></canvas>
    </div>

    <!-- Line Tension Bar for Reeling Phase -->
    <div class="tension-meter-container" id="tensionUI">
      <div class="tension-meter-label" id="tensionLabel">LINE TENSION</div>
      <div class="tension-bar-bg">
        <div class="tension-bar-fill" id="tensionFill"></div>
      </div>
    </div>

    <div class="tackle-selector" id="tackleUI">
      <label>RAPALA LURE SELECT</label>
      <select id="lureSelect">
        <option value="shad">Shad Rap (Deep Crank)</option>
        <option value="husky">Husky Jerk (Suspended)</option>
        <option value="skitter">Skitter Walk (Topwater)</option>
        <option value="dt">DT-10 (Structure Crank)</option>
      </select>

      <label>BAIT ATTRACTION</label>
      <select id="baitSelect">
        <option value="none">None (Lure Only)</option>
        <option value="minnow">Emerald Shiner (+30%)</option>
        <option value="nightcrawler">Nightcrawler (+20%)</option>
      </select>
    </div>

    <div id="statusText" class="status-msg">Use WASD or Controls to Navigate</div>

    <div class="controls-panel">
      <button class="btn" id="btnFWD">▲ FWD / REEL</button>
      <button class="btn" id="btnREV">▼ REV / SLACK</button>
      <button class="btn" id="btnLEFT">◀ STEER / ROD L</button>
      <button class="btn" id="btnRIGHT">STEER / ROD R ▶</button>
      <button class="btn cast" id="actionBtn">CAST LINE</button>
    </div>
  </div>

  <div id="catchModal" class="modal hidden">
    <h2 id="catchTitle" style="font-size:24px;color:#00ffcc;margin:0 0 10px">RECORD CATCH!</h2>
    <div id="catchDetails" style="font-size:16px;margin-bottom:20px">You caught a 8.5 lb Walleye!</div>
    <button class="btn" id="claimBtn">KEEP FISH</button>
  </div>
</div>

<script>
const canvas = document.getElementById('viewCanvas');
const ctx = canvas.getContext('2d');
const sonarCanvas = document.getElementById('sonarCanvas');
const sonarCtx = sonarCanvas.getContext('2d');
const mapCanvas = document.getElementById('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');

// --- Game Engine Variables ---
let gameState = 'navigating'; // 'navigating', 'casting', 'waiting', 'hooked', 'reeling'
let cash = 150;
let fishCount = 0;

// Boat Navigation Physics
let boat = {
  x: 120, y: 80, angle: 0, speed: 0,
  maxSpeed: 1.8, accel: 0.05, friction: 0.96, turnSpeed: 0.04
};

// Reeling Physics & Active Battle System
let activeFish = {
  species: 'Walleye',
  weight: 6.0,
  distance: 100,     // Distance to boat (0 = caught)
  tension: 30,       // Line tension percentage (0-100)
  stamina: 100,      // Fish energy
  xOffset: 0,        // Horizontal swimming sway
  pullDirection: 1,  // -1 for left, 1 for right
  isJumping: false,
  jumpTimer: 0
};

let rodAngle = 0; // -1 (full left) to 1 (full right)

// Controls input tracking
const keys = { w: false, s: false, a: false, d: false };

function getLakeDepth(x, y) {
  let nx = x / 300, ny = y / 200;
  let depth = 10 + (nx * 50) + Math.sin(ny * Math.PI) * 15;
  let dx = x - 100, dy = y - 70;
  if (Math.sqrt(dx*dx + dy*dy) < 30) depth -= 10;
  return Math.max(5, Math.min(65, depth));
}

let fishSchools = [];
for (let i = 0; i < 25; i++) {
  fishSchools.push({
    x: Math.random() * 280 + 10, y: Math.random() * 180 + 10,
    depth: Math.random() * 40 + 10,
    type: Math.random() > 0.4 ? 'Walleye' : (Math.random() > 0.5 ? 'Smallmouth Bass' : 'Yellow Perch')
  });
}

const LURES = {
  shad: { name: 'Shad Rap', depthRange: [8, 15], power: 1.3 },
  husky: { name: 'Husky Jerk', depthRange: [4, 10], power: 1.1 },
  skitter: { name: 'Skitter Walk', depthRange: [0, 4], power: 1.5 },
  dt: { name: 'DT-10', depthRange: [10, 25], power: 1.4 }
};

const BAITS = {
  none: { bonus: 1.0 },
  minnow: { bonus: 1.3 },
  nightcrawler: { bonus: 1.2 }
};

// Input Handling Setup
window.addEventListener('keydown', e => handleKey(e.key, true));
window.addEventListener('keyup', e => handleKey(e.key, false));

function handleKey(key, isPressed) {
  let k = key.toLowerCase();
  if (k === 'w' || k === 'arrowup') keys.w = isPressed;
  if (k === 's' || k === 'arrowdown') keys.s = isPressed;
  if (k === 'a' || k === 'arrowleft') keys.a = isPressed;
  if (k === 'd' || k === 'arrowright') keys.d = isPressed;
}

const bindBtn = (id, key) => {
  const btn = document.getElementById(id);
  btn.addEventListener('mousedown', () => keys[key] = true);
  btn.addEventListener('mouseup', () => keys[key] = false);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
};
bindBtn('btnFWD', 'w');
bindBtn('btnREV', 's');
bindBtn('btnLEFT', 'a');
bindBtn('btnRIGHT', 'd');

const actionBtn = document.getElementById('actionBtn');
actionBtn.addEventListener('click', () => {
  if (gameState === 'navigating') {
    startCasting();
  } else if (gameState === 'waiting') {
    retrieveLine();
  } else if (gameState === 'hooked') {
    startUnderwaterReeling();
  }
});

let lineProgress = 0;
function startCasting() {
  gameState = 'casting';
  boat.speed = 0;
  lineProgress = 0;
  actionBtn.textContent = 'CASTING...';
  showStatus('Casting lure into Lake Erie structure...');

  let castAnim = setInterval(() => {
    lineProgress += 0.08;
    if (lineProgress >= 1.0) {
      clearInterval(castAnim);
      gameState = 'waiting';
      actionBtn.textContent = 'RETRIEVE';
      showStatus('Lure deployed! Watching Sonar...');
      checkBiteLogic();
    }
  }, 40);
}

function retrieveLine() {
  gameState = 'navigating';
  actionBtn.textContent = 'CAST LINE';
  showStatus('Engaging Trolling Motor');
  document.getElementById('tensionUI').style.display = 'none';
  document.getElementById('mapUI').style.display = 'block';
  document.getElementById('sonarUI').style.display = 'block';
  document.getElementById('tackleUI').style.display = 'block';
  lineProgress = 0;
}

function checkBiteLogic() {
  if (gameState !== 'waiting') return;

  let currentDepth = getLakeDepth(boat.x, boat.y);
  let lure = LURES[document.getElementById('lureSelect').value];
  let bait = BAITS[document.getElementById('baitSelect').value];

  let nearFish = fishSchools.some(f => Math.hypot(f.x - boat.x, f.y - boat.y) < 20);
  let biteChance = (nearFish ? 0.6 : 0.15) * lure.power * bait.bonus;

  setTimeout(() => {
    if (gameState === 'waiting' && Math.random() < biteChance) {
      gameState = 'hooked';
      actionBtn.textContent = 'SET HOOK!';
      showStatus('FISH ON! SET THE HOOK!');
    }
  }, 2500 + Math.random() * 3000);
}

// Start Underwater Battle Phase
function startUnderwaterReeling() {
  gameState = 'reeling';
  actionBtn.textContent = 'REEL (HOLD W)';
  showStatus('HOLD W TO REEL! COUNTER SWIM DIRECTION!');

  // Hide Top Surface Navigation UIs and Show Tension Meter
  document.getElementById('mapUI').style.display = 'none';
  document.getElementById('sonarUI').style.display = 'none';
  document.getElementById('tackleUI').style.display = 'none';
  document.getElementById('tensionUI').style.display = 'block';

  let targetFish = ['Walleye', 'Smallmouth Bass', 'Yellow Perch', 'Lake Trout'];
  activeFish.species = targetFish[Math.floor(Math.random() * targetFish.length)];
  activeFish.weight = (Math.random() * 8 + 2).toFixed(1);
  activeFish.distance = 100;
  activeFish.tension = 35;
  activeFish.stamina = 100;
  activeFish.xOffset = 0;
  activeFish.pullDirection = Math.random() > 0.5 ? 1 : -1;
}

function updateReelingLogic() {
  if (gameState !== 'reeling') return;

  // 1. Rod Angle Control (A/D Keys)
  if (keys.a) rodAngle = Math.max(-1, rodAngle - 0.1);
  else if (keys.d) rodAngle = Math.min(1, rodAngle + 0.1);
  else rodAngle *= 0.9; // Center rod

  // 2. Fish AI Swim Patterns
  if (Math.random() < 0.03) {
    activeFish.pullDirection *= -1; // Randomly switch swim directions
  }
  
  // Fish pulls line sideways
  activeFish.xOffset += activeFish.pullDirection * (activeFish.stamina * 0.03);
  activeFish.xOffset = Math.max(-120, Math.min(120, activeFish.xOffset));

  // 3. Reeling & Tension Mechanics
  if (keys.w) { // Player Reeling
    activeFish.distance = Math.max(0, activeFish.distance - 0.35);
    activeFish.tension += 1.2;
    activeFish.stamina -= 0.2; // Wearing fish down
  } else if (keys.s) { // Giving Slack
    activeFish.tension = Math.max(0, activeFish.tension - 2.0);
  } else {
    // Natural tension decay
    activeFish.tension = Math.max(10, activeFish.tension - 0.4);
  }

  // Tension penalty if rod doesn't match opposite swim direction
  let countersteer = -Math.sign(activeFish.xOffset);
  if (Math.sign(rodAngle) === Math.sign(activeFish.xOffset) && Math.abs(activeFish.xOffset) > 20) {
    activeFish.tension += 0.8; // Bad angle builds tension fast
  } else if (Math.sign(rodAngle) === countersteer) {
    activeFish.tension -= 0.3; // Proper fighting angle reduces tension
  }

  // Fish Fight Surge
  if (Math.random() < 0.02 && activeFish.stamina > 20) {
    activeFish.tension += 15;
    showStatus('FISH IS SURGING!');
  }

  // Update UI Tension Bar
  document.getElementById('tensionFill').style.width = `${Math.min(100, activeFish.tension)}%`;

  // Win / Loss Conditions
  if (activeFish.tension >= 100) {
    showStatus('LINE SNAPPED! FISH ESCAPED!');
    retrieveLine();
  } else if (activeFish.distance <= 5) {
    completeCatch();
  }
}

function completeCatch() {
  let value = Math.round(activeFish.weight * 18);
  cash += value;
  fishCount++;

  document.getElementById('money').textContent = cash;
  document.getElementById('caughtCount').textContent = fishCount;

  document.getElementById('catchTitle').textContent = `LANDED A ${activeFish.species.toUpperCase()}!`;
  document.getElementById('catchDetails').textContent = `Weight: ${activeFish.weight} lbs | Earned $${value}`;
  document.getElementById('catchModal').classList.remove('hidden');
}

document.getElementById('claimBtn').addEventListener('click', () => {
  document.getElementById('catchModal').classList.add('hidden');
  retrieveLine();
});

function showStatus(text) {
  const el = document.getElementById('statusText');
  el.textContent = text;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  sonarCanvas.width = 160; sonarCanvas.height = 118;
  mapCanvas.width = 160; mapCanvas.height = 100;
}
window.addEventListener('resize', resize);
resize();

// --- Sonar Display Renderer ---
let sonarHistory = [];
function updateSonar() {
  if (gameState === 'reeling') return;
  let depth = getLakeDepth(boat.x, boat.y);
  let fishDetected = fishSchools.some(f => Math.hypot(f.x - boat.x, f.y - boat.y) < 12);
  
  sonarHistory.push({ depth: depth, fish: fishDetected });
  if (sonarHistory.length > 80) sonarHistory.shift();

  sonarCtx.fillStyle = '#001a00';
  sonarCtx.fillRect(0, 0, 160, 118);

  sonarCtx.strokeStyle = 'rgba(0, 255, 0, 0.15)';
  sonarCtx.lineWidth = 1;
  for (let i = 0; i < 118; i += 20) {
    sonarCtx.beginPath(); sonarCtx.moveTo(0, i); sonarCtx.lineTo(160, i); sonarCtx.stroke();
  }

  sonarCtx.beginPath();
  sonarCtx.strokeStyle = '#00ff00';
  sonarCtx.lineWidth = 2;
  for (let x = 0; x < sonarHistory.length; x++) {
    let screenX = x * 2;
    let screenY = (sonarHistory[x].depth / 65) * 90 + 20;
    if (x === 0) sonarCtx.moveTo(screenX, screenY);
    else sonarCtx.lineTo(screenX, screenY);

    if (sonarHistory[x].fish && Math.random() > 0.4) {
      sonarCtx.fillStyle = '#ffff00';
      sonarCtx.fillRect(screenX, screenY - 15 - Math.random() * 20, 4, 3);
    }
  }
  sonarCtx.stroke();

  sonarCtx.fillStyle = '#00ff00';
  sonarCtx.font = '10px Courier New';
  sonarCtx.fillText(`DEPTH: ${depth.toFixed(1)}ft`, 6, 12);
}

// --- Lake Erie Topo Map Renderer ---
function drawLakeErieMap() {
  if (gameState === 'reeling') return;
  mapCtx.fillStyle = '#05131d';
  mapCtx.fillRect(0, 0, 160, 100);

  mapCtx.strokeStyle = '#005577';
  mapCtx.lineWidth = 1;
  for (let d = 10; d <= 50; d += 10) {
    mapCtx.beginPath();
    for (let x = 0; x < 160; x += 10) {
      let mapX = (x / 160) * 300;
      let calcD = getLakeDepth(mapX, 100);
      if (Math.abs(calcD - d) < 5) mapCtx.lineTo(x, d * 1.5);
    }
    mapCtx.stroke();
  }

  let boatMapX = (boat.x / 300) * 160;
  let boatMapY = (boat.y / 200) * 100;
  mapCtx.fillStyle = '#ff0000';
  mapCtx.beginPath();
  mapCtx.arc(boatMapX, boatMapY, 3, 0, Math.PI * 2);
  mapCtx.fill();
}

// --- Main 3D Perspective & Underwater Renderers ---
function updatePhysics() {
  if (gameState === 'navigating') {
    if (keys.w) boat.speed = Math.min(boat.speed + boat.accel, boat.maxSpeed);
    if (keys.s) boat.speed = Math.max(boat.speed - boat.accel, -boat.maxSpeed * 0.5);
    if (keys.a) boat.angle -= boat.turnSpeed;
    if (keys.d) boat.angle += boat.turnSpeed;

    boat.speed *= boat.friction;
    boat.x += Math.sin(boat.angle) * boat.speed;
    boat.y -= Math.cos(boat.angle) * boat.speed;

    boat.x = Math.max(10, Math.min(290, boat.x));
    boat.y = Math.max(10, Math.min(190, boat.y));
  } else if (gameState === 'reeling') {
    updateReelingLogic();
  }
}

// Underwater Reeling Battle Renderer
function renderUnderwaterView() {
  const w = canvas.width;
  const h = canvas.height;

  // Deep Water Gradient with Sun Rays
  let waterGrad = ctx.createLinearGradient(0, 0, 0, h);
  waterGrad.addColorStop(0, '#024b5e');
  waterGrad.addColorStop(0.5, '#012834');
  waterGrad.addColorStop(1, '#000f14');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, 0, w, h);

  // Underwater Sun Rays
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    ctx.moveTo(w * 0.2 + (i * 120), 0);
    ctx.lineTo(w * 0.1 + (i * 150), h);
    ctx.lineTo(w * 0.2 + (i * 150) + 40, h);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Lake Erie Lakebed Floor
  ctx.fillStyle = '#06171a';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.85);
  ctx.quadraticCurveTo(w * 0.5, h * 0.8, w, h * 0.88);
  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.fill();

  // 3. Render Hooked Fish
  ctx.save();
  let fishX = (w * 0.5) + activeFish.xOffset;
  let fishY = h * 0.45 + Math.sin(Date.now() * 0.005) * 15;
  let scale = 0.5 + ((100 - activeFish.distance) / 100) * 0.8; // Grows closer as reeled

  ctx.translate(fishX, fishY);
  ctx.scale(scale * (activeFish.pullDirection > 0 ? 1 : -1), scale);

  // Fish Body (Rapala Style 2D Silhouette Render)
  ctx.fillStyle = activeFish.stamina < 30 ? '#558877' : '#22aa77';
  ctx.beginPath();
  ctx.ellipse(0, 0, 50, 22, 0, 0, Math.PI * 2); // Body
  ctx.fill();

  // Tail Fin (Animated Thrush)
  let tailWag = Math.sin(Date.now() * 0.02) * 12;
  ctx.fillStyle = '#117755';
  ctx.beginPath();
  ctx.moveTo(-45, 0);
  ctx.lineTo(-75, -20 + tailWag);
  ctx.lineTo(-75, 20 + tailWag);
  ctx.closePath();
  ctx.fill();

  // Eye and Mouth Hook
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(32, -6, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000000';
  ctx.beginPath(); ctx.arc(34, -6, 2, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // 4. Fishing Line to Rod (Dynamic Tension Curve)
  ctx.save();
  let rodTipX = (w * 0.5) + (rodAngle * (w * 0.35));
  let rodTipY = 30;

  ctx.strokeStyle = activeFish.tension > 75 ? '#ff0000' : 'rgba(255,255,255,0.8)';
  ctx.lineWidth = activeFish.tension > 75 ? 3 : 1.5;
  ctx.beginPath();
  ctx.moveTo(rodTipX, rodTipY);
  ctx.quadraticCurveTo((rodTipX + fishX) / 2, (rodTipY + fishY) / 2 + (100 - activeFish.tension), fishX, fishY);
  ctx.stroke();

  // On-Screen Rod Directional Arrow
  ctx.fillStyle = '#00ffcc';
  ctx.font = '12px Courier New';
  ctx.fillText(`COUNTER-STEER ROD (A/D): ${rodAngle < -0.2 ? '◄ LEFT' : (rodAngle > 0.2 ? 'RIGHT ►' : 'CENTER')}`, w * 0.35, 40);
  ctx.fillText(`DISTANCE: ${activeFish.distance.toFixed(0)} FT`, w * 0.42, 60);

  ctx.restore();
}

function render3DView() {
  if (gameState === 'reeling') {
    renderUnderwaterView();
    return;
  }

  const w = canvas.width, h = canvas.height;
  const horizon = h * 0.42;

  // Sky
  let skyGrad = ctx.createLinearGradient(0, 0, 0, horizon);
  skyGrad.addColorStop(0, '#041019'); skyGrad.addColorStop(1, '#1b4958');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, w, horizon);

  // Water Surface
  let waterGrad = ctx.createLinearGradient(0, horizon, 0, h);
  waterGrad.addColorStop(0, '#092d38'); waterGrad.addColorStop(1, '#01090d');
  ctx.fillStyle = waterGrad; ctx.fillRect(0, horizon, w, h - horizon);

  // Shoreline Horizon
  ctx.fillStyle = '#061721';
  ctx.beginPath(); ctx.moveTo(0, horizon);
  for (let x = 0; x <= w; x += 30) {
    let hill = Math.sin((x + boat.angle * 300) * 0.008) * 18 + Math.cos(boat.x * 0.05) * 10;
    ctx.lineTo(x, horizon - Math.max(2, hill));
  }
  ctx.lineTo(w, horizon); ctx.fill();

  // Boat Interior Cockpit
  ctx.save();
  ctx.fillStyle = '#0e181e';
  ctx.beginPath();
  ctx.moveTo(0, h); ctx.lineTo(w * 0.12, horizon + (h * 0.22));
  ctx.lineTo(w * 0.5, horizon + (h * 0.18));
  ctx.lineTo(w * 0.88, horizon + (h * 0.22)); ctx.lineTo(w, h);
  ctx.fill();

  ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.stroke();

  // Steering Console
  ctx.fillStyle = '#091319';
  ctx.fillRect(w * 0.35, h - 120, w * 0.3, 120);
  ctx.strokeRect(w * 0.35, h - 120, w * 0.3, 120);

  ctx.strokeStyle = '#3a5866'; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(w * 0.5, h - 40, 35, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // Line & Rod Surface Render
  if (gameState !== 'navigating') {
    ctx.save();
    let rodX = w * 0.7, rodY = h * 0.52;
    let lureX = w * 0.5, lureY = horizon + (lineProgress * (h * 0.25));

    ctx.strokeStyle = '#2b1d0c'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(w * 0.85, h); ctx.lineTo(rodX, rodY); ctx.stroke();

    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(rodX, rodY);
    ctx.quadraticCurveTo(rodX, lureY, lureX, lureY); ctx.stroke();

    ctx.fillStyle = gameState === 'hooked' ? '#ff0000' : '#ff9900';
    ctx.beginPath(); ctx.arc(lureX, lureY, gameState === 'hooked' ? 7 : 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// Game Loop
function loop() {
  updatePhysics();
  render3DView();
  updateSonar();
  drawLakeErieMap();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
