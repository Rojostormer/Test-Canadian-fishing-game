<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030c10">
<title>Canadian Waters — First-Person Pro Fishing</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:#030c10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;min-height:100%;touch-action:pan-y;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.app{max-width:840px;margin:auto;padding:8px 0 20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.6px;background:linear-gradient(180deg,#fff,#a5c4d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:10px;color:#7a9cb0;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.stats{text-align:right;font-weight:800;font-size:13px;color:#e2f1f8;line-height:1.3}
.stats span{color:#4cc9f0}
.card{background:rgba(20,35,45,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 12px 32px rgba(0,0,0,.4)}

/* ---- viewport / canvas ---- */
.lakeWrap{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.6);background:#020a0d;border:1px solid rgba(255,255,255,.15)}
#scene{display:block;width:100%;height:auto;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.badge{position:absolute;top:12px;left:12px;background:rgba(8,24,32,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px;padding:6px 12px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.18);color:#d1e8f2;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.badge.right{left:auto;right:12px}
.spot-flag{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffca28,#f57c00);color:#120a00;border-radius:99px;padding:6px 16px;font-size:11px;font-weight:900;opacity:0;transition:all .3s ease;box-shadow:0 4px 16px rgba(245,124,0,.5);letter-spacing:.5px}
.spot-flag.show{opacity:1}

/* zoom controls */
.zoomControls{position:absolute;top:54px;right:12px;display:flex;flex-direction:column;gap:8px}
.zoomBtn{width:36px;height:36px;border-radius:10px;background:rgba(8,24,32,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}

/* dashboard elements: sonar & overview map */
.dashboard{position:absolute;bottom:14px;left:14px;display:flex;gap:10px;pointer-events:none}
.dashBox{width:110px;height:95px;background:rgba(6,18,24,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:14px;overflow:hidden;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.dashLabel{position:absolute;top:4px;left:6px;font-size:8px;font-weight:900;color:#00ffcc;letter-spacing:.6px;z-index:2;text-shadow:0 0 4px rgba(0,255,204,.5)}
.dashBox canvas{width:100%;height:100%;display:block}

/* joystick */
.stick{position:absolute;right:130px;bottom:14px;width:94px;height:94px;border-radius:50%;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.25);touch-action:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.stick .knob{position:absolute;width:42px;height:42px;left:24px;top:24px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.3));border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(0,0,0,.4)}

/* buttons */
.actionGroup{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.mainBtn{width:96px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ff7b00,#e65100);color:#fff;font-weight:900;font-size:13px;border:1px solid rgba(255,255,255,.4);box-shadow:0 6px 18px rgba(230,81,0,.4);letter-spacing:.4px}
.mainBtn.reel{background:linear-gradient(135deg,#00b4d8,#0077b6);box-shadow:0 6px 18px rgba(0,119,182,.4)}
.mainBtn:disabled{opacity:.35}
.aimHint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(8,24,32,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 18px;border-radius:99px;font-size:12px;font-weight:800;text-align:center;white-space:nowrap;border:1px solid rgba(255,255,255,.2);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.cancelAim{position:absolute;right:14px;bottom:14px;width:76px;height:46px;border-radius:14px;background:linear-gradient(135deg,#e63946,#d62828);color:#fff;font-weight:900;font-size:11px;border:1px solid rgba(255,255,255,.3);box-shadow:0 6px 18px rgba(214,40,40,.4)}

/* fight controls */
.fightWrap{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,rgba(3,12,16,.95) 45%)}
.meterRow{display:flex;gap:12px;margin-bottom:10px}
.meterRow .m{flex:1}
.meterRow label{font-size:10px;color:#a0c4d6;font-weight:800;letter-spacing:.6px}
.bar{height:12px;background:rgba(0,0,0,.5);border-radius:99px;overflow:hidden;margin-top:4px;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.fill{height:100%;width:20%;background:linear-gradient(90deg,#4cc9f0,#4895ef);transition:width .12s}
.fill.red{background:linear-gradient(90deg,#ff4d6d,#c9184a)}
.fightBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fightBtns button{min-height:54px;border:0;border-radius:14px;font-weight:900;font-size:14px;color:#fff;border:1px solid rgba(255,255,255,.2)}
#reelBtn{background:linear-gradient(135deg,#00b4d8,#0077b6);box-shadow:0 6px 18px rgba(0,119,182,.4)}
#runBtn{background:linear-gradient(135deg,#2a9d8f,#264653);box-shadow:0 6px 18px rgba(38,70,83,.4)}
.hookPrompt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(2,10,14,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hookPrompt button{min-height:64px;min-width:180px;border:0;border-radius:99px;background:linear-gradient(135deg,#ffca28,#f57c00);color:#120a00;font-weight:900;font-size:17px;letter-spacing:.5px;box-shadow:0 8px 24px rgba(245,124,0,.5);border:2px solid rgba(255,255,255,.4)}
.strikeTimer{width:180px;height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.strikeTimer i{display:block;height:100%;background:#ffca28;width:100%}

.message{font-size:15px;font-weight:800;min-height:20px;display:flex;align-items:center;justify-content:center;text-align:center}

/* lower panel controls */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,select{width:100%;min-height:48px;border:0;border-radius:14px;font-size:14px;font-weight:900;color:#fff;background:linear-gradient(135deg,#00b4d8,#0077b6);border:1px solid rgba(255,255,255,.18)}
button.secondary{background:linear-gradient(135deg,#2b3a42,#1a252c)}
select{padding:0 12px;background:#1a252c;border:1px solid rgba(255,255,255,.15)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.label{font-size:11px;color:#7a9cb0;margin-bottom:6px;font-weight:700;letter-spacing:.5px}
.trophy{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.trophy:last-child{border-bottom:0}
.hidden{display:none!important}
.result{text-align:center}
.fishImgContainer{height:120px;display:flex;align-items:center;justify-content:center;margin:10px 0}
.fishImgContainer img{max-height:100%;max-width:80%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6))}
.small{font-size:11px;color:#7a9cb0;line-height:1.4}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>CANADIAN WATERS</h1><div class="sub">First-Person Pro Fishing • Ontario</div></div>
  <div class="stats">$<span id="money">100</span><br><span id="xp">0</span> XP</div>
</header>

<div class="card" style="padding:0">
  <div class="lakeWrap">
    <canvas id="scene" width="900" height="580"></canvas>
    
    <div class="hud" id="hud">
      <div class="badge" id="timeBadge">06:40 AM</div>
      <div class="badge right" id="depthBadge">— FT</div>
      <div class="spot-flag" id="spotFlag">WEED EDGE</div>

      <!-- Zoom controls -->
      <div class="zoomControls">
        <button class="zoomBtn" id="zoomInBtn">+</button>
        <button class="zoomBtn" id="zoomOutBtn">−</button>
      </div>

      <!-- Dashboard displays: Fish Finder & Overview Map -->
      <div class="dashboard">
        <div class="dashBox">
          <div class="dashLabel">FISH FINDER</div>
          <canvas id="sonarCanvas" width="110" height="95"></canvas>
        </div>
        <div class="dashBox">
          <div class="dashLabel">MAP OVERVIEW</div>
          <canvas id="mapCanvas" width="110" height="95"></canvas>
        </div>
      </div>

      <!-- driving controls -->
      <div id="driveControls">
        <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
        <div class="actionGroup">
          <button class="mainBtn" id="castBtn">CAST</button>
        </div>
      </div>

      <!-- waiting / retrieve line controls -->
      <div id="waitControls" class="hidden">
        <div id="waitOverlay" style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%)">
          <div class="message" id="waitMsg" style="background:rgba(8,24,32,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 18px;border-radius:99px;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 20px rgba(0,0,0,.4)"></div>
        </div>
        <div class="actionGroup">
          <button class="mainBtn reel" id="retrieveBtn">REEL IN</button>
        </div>
      </div>

      <!-- aiming controls -->
      <div id="aimControls" class="hidden">
        <div class="aimHint" id="aimHint">Drag on the water to aim, release to cast</div>
        <button class="cancelAim" id="cancelAimBtn">CANCEL</button>
      </div>

      <!-- set the hook prompt -->
      <div id="hookPrompt" class="hookPrompt hidden">
        <div class="message" id="hookMsg">STRIKE!</div>
        <div class="strikeTimer"><i id="strikeBar"></i></div>
        <button id="hookBtn">SET THE HOOK</button>
      </div>

      <!-- fight controls -->
      <div id="fightWrap" class="fightWrap hidden">
        <div class="message" id="fightMsg" style="margin-bottom:6px"></div>
        <div class="meterRow">
          <div class="m"><label>LINE TENSION</label><div class="bar"><div id="tension" class="fill"></div></div></div>
          <div class="m"><label>FISH STAMINA</label><div class="bar"><div id="stamina" class="fill"></div></div></div>
        </div>
        <div class="fightBtns">
          <button id="runBtn">LET IT RUN</button>
          <button id="reelBtn">REEL IN</button>
        </div>
      </div>
    </div>
  </div>
</div>

<section class="card">
  <div class="row">
    <div style="flex:1">
      <div class="label">LURE</div>
      <select id="lure">
        <option value="spoon">Silver Spoon</option>
        <option value="jig">Green Pumpkin Jig</option>
        <option value="crank">Minnow Crankbait</option>
      </select>
    </div>
  </div>
</section>

<section id="result" class="card result hidden">
  <div class="fishImgContainer">
    <img id="fishRender" src="" alt="Caught Fish">
  </div>
  <h2 id="fishName" style="margin:4px 0;font-weight:900">Fish</h2>
  <div id="fishStats"></div>
  <div style="height:14px"></div>
  <div class="actions">
    <button id="castAgainBtn">CAST AGAIN</button>
    <button id="backToBoatBtn" class="secondary">DRIVE BOAT</button>
  </div>
</section>

<section class="card">
  <h3 style="margin:0 0 10px;font-size:14px;letter-spacing:.4px">Trophy Book</h3>
  <div class="trophy"><span>Smallmouth Bass</span><strong id="bestBass">No record</strong></div>
  <div class="trophy"><span>Northern Pike</span><strong id="bestPike">No record</strong></div>
  <div class="trophy"><span>Walleye</span><strong id="bestWalleye">No record</strong></div>
  <div class="small" style="margin-top:10px">Fish caught: <span id="caught">0</span></div>
</section>

<script>
const $=id=>document.getElementById(id);

/* ---------- High-Res Transparent Fish Image Preloading ---------- */
const fishImages = {
  bass: new Image(),
  pike: new Image(),
  walleye: new Image()
};
fishImages.bass.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Smallmouth_bass.png/640px-Smallmouth_bass.png";
fishImages.pike.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Northern_pike.png/640px-Northern_pike.png";
fishImages.walleye.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Sander_vitreus.png/640px-Sander_vitreus.png";

/* ---------- world setup ---------- */
const WORLD_W=2200, WORLD_H=1600;
const CENTER={x:WORLD_W/2,y:WORLD_H/2};

function mulberry32(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
const rand=mulberry32(20260820);

// lake geometry
const baseR=560;
const harmonics=[
  {n:2,amp:70,ph:rand()*7},
  {n:3,amp:95,ph:rand()*7},
  {n:5,amp:55,ph:rand()*7},
  {n:7,amp:34,ph:rand()*7},
  {n:11,amp:18,ph:rand()*7}
];
function lakeRadius(a){
  let r=baseR;
  for(const h of harmonics) r+=h.amp*Math.sin(h.n*a+h.ph);
  return r;
}
const LAKE_STEPS=220;
const lakePts=[];
for(let i=0;i<LAKE_STEPS;i++){
  const a=(i/LAKE_STEPS)*Math.PI*2;
  const r=lakeRadius(a);
  lakePts.push({x:CENTER.x+Math.cos(a)*r,y:CENTER.y+Math.sin(a)*r*0.82});
}

const islands=[
  {cx:CENTER.x-230,cy:CENTER.y-90,r:80,ph:rand()*7},
  {cx:CENTER.x+260,cy:CENTER.y+150,r:58,ph:rand()*7}
];
function islandPts(isl){
  const pts=[];
  for(let i=0;i<40;i++){
    const a=(i/40)*Math.PI*2;
    const r=isl.r*(1+0.25*Math.sin(3*a+isl.ph)+0.15*Math.sin(5*a+isl.ph*1.7));
    pts.push({x:isl.cx+Math.cos(a)*r,y:isl.cy+Math.sin(a)*r});
  }
  return pts;
}
const islandPolys=islands.map(islandPts);

const hotspots=[
  {x:CENTER.x-330,y:CENTER.y+260,r:150,name:"WEED EDGE",bonus:"bass"},
  {x:CENTER.x+380,y:CENTER.y-260,r:140,name:"ROCKY POINT",bonus:"pike"},
  {x:CENTER.x+120,y:CENTER.y+330,r:130,name:"DEEP DROP-OFF",bonus:"walleye"},
  {x:CENTER.x-390,y:CENTER.y-190,r:120,name:"SUNKEN TIMBER",bonus:"pike"}
];

/* ---------- collision mask ---------- */
const maskCanvas=document.createElement('canvas');
maskCanvas.width=WORLD_W;maskCanvas.height=WORLD_H;
const mctx=maskCanvas.getContext('2d');

function pathFor(ctx,pts){
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();
}

function buildMask(){
  mctx.fillStyle='#000';
  mctx.fillRect(0,0,WORLD_W,WORLD_H);
  pathFor(mctx,lakePts);
  mctx.fillStyle='#fff';
  mctx.fill();
  islandPolys.forEach(poly=>{
    pathFor(mctx,poly);
    mctx.fillStyle='#000';
    mctx.fill();
  });
}
buildMask();
const maskData=mctx.getImageData(0,0,WORLD_W,WORLD_H).data;

function isWater(x,y){
  if(x<0||y<0||x>=WORLD_W||y>=WORLD_H) return false;
  const idx=((y|0)*WORLD_W+(x|0))*4;
  return maskData[idx]>128;
}
function hotspotNear(x,y){
  for(const h of hotspots){
    if(Math.hypot(h.x-x,h.y-y)<h.r) return h;
  }
  return null;
}

/* ---------- state ---------- */
const canvas=$('scene');
const ctx=canvas.getContext('2d');
let VIEW_W=900,VIEW_H=580;

const boat={x:CENTER.x,y:CENTER.y-baseR*0.5,heading:-Math.PI/2,speed:0};
let cameraZoom=1.0;
let joy={active:false,dx:0,dy:0,id:null};

const state={
  phase:'driving', // driving | aiming | casting | waiting | strike | fighting | landed
  money:100,xp:0,caught:0,bass:0,pike:0,walleye:0,
  fish:null,weight:0,length:0,
  tension:.2,stamina:1,
  lurePos:null, castFrom:null, castT:0,
  fishSwimPhase:0, fishJumpT:0,
  aim:{active:false,x:0,y:0},
  strikeDeadline:0,
  timeMinutes:6*60+40
};

const MAX_CAST=280;

const lureBonus={
 spoon:{bass:.90,pike:1.35,walleye:1.05},
 jig:{bass:1.45,pike:.65,walleye:1.20},
 crank:{bass:1.15,pike:1.20,walleye:.85}
};
const speciesMeta={
  bass:{label:'Smallmouth Bass',min:.7,max:7,lenBase:13,lenMul:3},
  pike:{label:'Northern Pike',min:2,max:30,lenBase:24,lenMul:1.5},
  walleye:{label:'Walleye',min:1,max:12,lenBase:17,lenMul:2.1}
};

/* sonar state */
const sonarHistory=[];
for(let i=0;i<100;i++) sonarHistory.push(10+Math.sin(i*0.1)*2);

/* ---------- UI & Zoom ---------- */
function fitCanvas(){
  const w=canvas.clientWidth||900;
  const h=Math.round(w*(580/900));
  canvas.width=w; canvas.height=h;
  VIEW_W=w;VIEW_H=h;
}
window.addEventListener('resize',fitCanvas);

$('zoomInBtn').addEventListener('click',()=>cameraZoom=Math.min(2.0,cameraZoom+0.2));
$('zoomOutBtn').addEventListener('click',()=>cameraZoom=Math.max(0.6,cameraZoom-0.2));

function setPhase(p){
  state.phase=p;
  $('driveControls').classList.toggle('hidden',p!=='driving');
  $('aimControls').classList.toggle('hidden',p!=='aiming');
  $('waitControls').classList.toggle('hidden',!(p==='casting'||p==='waiting'));
  $('hookPrompt').classList.toggle('hidden',p!=='strike');
  $('fightWrap').classList.toggle('hidden',p!=='fighting');
  $('result').classList.toggle('hidden',p!=='landed');
}

/* ---------- inputs ---------- */
const stickEl=$('stick'), knobEl=$('knob');
function stickCenter(){
  const r=stickEl.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2,radius:r.width/2};
}
function setKnob(dx,dy){
  knobEl.style.left=(24+dx)+'px';
  knobEl.style.top=(24+dy)+'px';
}
stickEl.addEventListener('pointerdown',e=>{
  if(state.phase!=='driving') return;
  joy.active=true;joy.id=e.pointerId;
  stickEl.setPointerCapture(e.pointerId);
  updateStick(e);
});
stickEl.addEventListener('pointermove',e=>{ if(joy.active&&e.pointerId===joy.id) updateStick(e); });
function endStick(e){
  if(joy.active&&(!e||e.pointerId===joy.id)){
    joy.active=false;joy.dx=0;joy.dy=0;setKnob(0,0);
  }
}
stickEl.addEventListener('pointerup',endStick);
stickEl.addEventListener('pointercancel',endStick);
function updateStick(e){
  const c=stickCenter();
  let dx=e.clientX-c.x, dy=e.clientY-c.y;
  const max=c.radius-6;
  const d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  joy.dx=dx/max; joy.dy=dy/max;
  setKnob(dx,dy);
}

/* aiming drag */
let aimPointerId=null;
canvas.addEventListener('pointerdown',e=>{
  if(state.phase!=='aiming') return;
  aimPointerId=e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  updateAim(e);
});
canvas.addEventListener('pointermove',e=>{
  if(state.phase!=='aiming'||e.pointerId!==aimPointerId) return;
  updateAim(e);
});
function endAim(e){
  if(state.phase!=='aiming'||(e&&e.pointerId!==aimPointerId)) return;
  aimPointerId=null;
  if(state.aim.active) launchCast();
}
canvas.addEventListener('pointerup',endAim);
canvas.addEventListener('pointercancel',endAim);

function updateAim(e){
  const r=canvas.getBoundingClientRect();
  const scale=VIEW_W/r.width;
  state.aim.active=true;
  state.aim.x=(e.clientX-r.left)*scale;
  state.aim.y=(e.clientY-r.top)*scale;
}

$('castBtn').addEventListener('click',()=>{
  if(state.phase!=='driving') return;
  state.aim.active=false;
  setPhase('aiming');
  $('aimHint').textContent='Drag on the water to aim, release to cast';
});
$('cancelAimBtn').addEventListener('click',()=>{ setPhase('driving'); });
$('retrieveBtn').addEventListener('click',()=>{
  setPhase('driving');
  state.lurePos=null;
});
$('hookBtn').addEventListener('click',setHook);
$('reelBtn').addEventListener('click',reel);
$('runBtn').addEventListener('click',runLine);
$('castAgainBtn').addEventListener('click',()=>{ setPhase('aiming'); state.aim.active=false; });
$('backToBoatBtn').addEventListener('click',()=>{ setPhase('driving'); });

/* ---------- casting & fighting logic ---------- */
function launchCast(){
  const screenDx = state.aim.x - VIEW_W/2;
  const screenDy = (VIEW_H*0.85) - state.aim.y;
  
  if(screenDy < 20){ setPhase('driving'); return; }

  const dist = Math.min(MAX_CAST, screenDy * (1.5 / cameraZoom));
  const angleOffset = (screenDx / (VIEW_W * 0.5)) * (0.8 / cameraZoom);
  const castAngle = boat.heading + angleOffset;

  let targetX = boat.x + Math.cos(castAngle) * dist;
  let targetY = boat.y + Math.sin(castAngle) * dist;

  if(!isWater(targetX, targetY)){
    let stepDist = dist;
    while(stepDist > 30 && !isWater(targetX, targetY)){
      stepDist -= 15;
      targetX = boat.x + Math.cos(castAngle) * stepDist;
      targetY = boat.y + Math.sin(castAngle) * stepDist;
    }
    if(!isWater(targetX, targetY)){ setPhase('driving'); return; }
  }

  state.castFrom = {x:boat.x, y:boat.y};
  state.lurePos = {x:targetX, y:targetY};
  state.castT = 0;
  setPhase('casting');
  $('waitMsg').textContent = 'Casting...';
}

function triggerStrike(){
  const l=lureBonus[$('lure').value];
  const hs=hotspotNear(state.lurePos.x,state.lurePos.y);
  const weights={bass:l.bass,pike:l.pike,walleye:l.walleye};
  if(hs&&hs.bonus) weights[hs.bonus]*=1.6;
  const total=weights.bass+weights.pike+weights.walleye;
  let r=rand()*total, pick='bass';
  if(r<weights.bass) pick='bass'; else if(r<weights.bass+weights.pike) pick='pike'; else pick='walleye';
  const meta=speciesMeta[pick];
  state.fish=pick;
  state.weight=+(meta.min+Math.pow(rand(),1.7)*(meta.max-meta.min)).toFixed(2);
  state.length=Math.round(meta.lenBase+state.weight*meta.lenMul+(rand()*5-2));
  state.strikeDeadline=1.3;
  setPhase('strike');
  $('hookMsg').textContent='STRIKE!';
}

function setHook(){
  if(state.phase!=='strike') return;
  state.tension=.45;state.stamina=1;
  setPhase('fighting');
  $('fightMsg').textContent='Fish on! Balance tension.';
}

function reel(){
  if(state.phase!=='fighting') return;
  state.tension=Math.min(1,state.tension+.03+rand()*.10);
  if(rand()<.35) state.stamina-=.06+rand()*.08;
  if(state.tension>=1){
    $('fightMsg').textContent='The line snapped!';
    setTimeout(()=>setPhase('driving'),500);
    return;
  }
  if(state.stamina<=0){ land(); return; }
  $('fightMsg').textContent=state.tension>.8?'High Tension! Let it run.':'Reeling in...';
}

function runLine(){
  if(state.phase!=='fighting') return;
  state.tension=Math.max(.18,state.tension-(.15+rand()*.13));
  state.stamina=Math.max(0,state.stamina-(.02+rand()*.05));
  $('fightMsg').textContent='Fish running... tension dropped.';
}

function land(){
  state.caught++;
  const reward=Math.floor(state.weight*8), gain=Math.floor(state.weight*12);
  state.money+=reward; state.xp+=gain;
  state[state.fish]=Math.max(state[state.fish],state.weight);
  const meta=speciesMeta[state.fish];
  
  $('fishRender').src = fishImages[state.fish].src;
  $('fishName').textContent=meta.label;
  $('fishStats').innerHTML=`<strong>${state.weight.toFixed(2)} lb</strong> • ${state.length} in<br><span class="small">+$${reward} credits • +${gain} XP</span>`;
  setPhase('landed');
}

/* ---------- loop & physics ---------- */
let lastT=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-lastT)/1000);
  lastT=now;
  update(dt);
  drawFirstPerson();
  drawSonar();
  drawOverviewMap();
  requestAnimationFrame(loop);
}

function update(dt){
  state.timeMinutes+=dt*1.4;

  if(state.phase==='driving'){
    const mag=Math.min(1,Math.hypot(joy.dx,joy.dy));
    if(mag>.12){
      boat.heading += joy.dx * 1.8 * dt;
      const targetSpeed = -joy.dy * 140;
      boat.speed += (targetSpeed - boat.speed) * dt * 3.0;
    } else {
      boat.speed += (0 - boat.speed) * dt * 2.0;
    }
    const nx = boat.x + Math.cos(boat.heading) * boat.speed * dt;
    const ny = boat.y + Math.sin(boat.heading) * boat.speed * dt;
    if(isWater(nx,ny)){ boat.x=nx; boat.y=ny; } else { boat.speed = -boat.speed * 0.3; }
  }

  if(state.phase==='casting'){
    state.castT += dt / 0.6;
    if(state.castT >= 1){
      state.castT = 1;
      setPhase('waiting');
      state.waitTimer = 1.2 + rand() * 2.5;
      if(hotspotNear(state.lurePos.x, state.lurePos.y)) state.waitTimer *= 0.5;
      $('waitMsg').textContent = 'Lure in water. Waiting for a bite...';
    }
  } else if(state.phase==='waiting'){
    state.waitTimer -= dt;
    if(state.waitTimer <= 0) triggerStrike();
  } else if(state.phase==='strike'){
    state.strikeDeadline -= dt;
    $('strikeBar').style.width = Math.max(0, (state.strikeDeadline/1.3)*100)+'%';
    if(state.strikeDeadline <= 0){ setPhase('driving'); }
  } else if(state.phase==='fighting'){
    state.fishSwimPhase += dt * 4;
  }

  // Sonar history update
  if(Math.random()<0.15){
    const hs = hotspotNear(boat.x, boat.y);
    const baseDepth = hs ? 25 : 12 + Math.sin(boat.x*0.01)*5;
    sonarHistory.shift();
    sonarHistory.push(baseDepth + (Math.random() - 0.5) * 2);
  }

  // HUD
  $('money').textContent=state.money;
  $('xp').textContent=state.xp;
  $('caught').textContent=state.caught;
  $('bestBass').textContent=state.bass?state.bass.toFixed(2)+' lb':'No record';
  $('bestPike').textContent=state.pike?state.pike.toFixed(2)+' lb':'No record';
  $('bestWalleye').textContent=state.walleye?state.walleye.toFixed(2)+' lb':'No record';
  $('tension').style.width=(state.tension*100)+'%';
  $('tension').className='fill '+(state.tension>.8?'red':'');
  $('stamina').style.width=(state.stamina*100)+'%';

  const mins=Math.floor(state.timeMinutes)%1440;
  const hh=Math.floor(mins/60), mm=mins%60;
  $('timeBadge').textContent=`${String(((hh+11)%12)+1).padStart(2,'0')}:${String(mm).padStart(2,'0')} ${hh<12?'AM':'PM'}`;

  const hs=hotspotNear(boat.x,boat.y);
  $('depthBadge').textContent=hs?hs.name:(Math.round(10+((boat.x+boat.y)%18))+' FT');
  $('spotFlag').classList.toggle('show',!!hs && state.phase==='driving');
  if(hs) $('spotFlag').textContent=hs.name;
}

/* ---------- rendering: High Details & Lighting ---------- */
function drawFirstPerson(){
  ctx.clearRect(0,0,VIEW_W,VIEW_H);

  // 1. Sky Gradient & Volumetric Sun Shafts
  const skyGrad = ctx.createLinearGradient(0, 0, 0, VIEW_H * 0.45);
  skyGrad.addColorStop(0, '#04151f');
  skyGrad.addColorStop(0.5, '#113243');
  skyGrad.addColorStop(1, '#2c5d73');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H * 0.45);

  // Volumetric Sun Rays
  ctx.save();
  const rayGrad = ctx.createRadialGradient(VIEW_W*0.5, 0, 10, VIEW_W*0.5, 0, VIEW_H*0.6);
  rayGrad.addColorStop(0, 'rgba(255, 235, 170, 0.25)');
  rayGrad.addColorStop(1, 'rgba(255, 235, 170, 0)');
  ctx.fillStyle = rayGrad;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H * 0.45);
  ctx.restore();

  // 2. Realistic Water Perspective
  const horizonY = VIEW_H * 0.42;
  const waterGrad = ctx.createLinearGradient(0, horizonY, 0, VIEW_H);
  waterGrad.addColorStop(0, '#12414d');
  waterGrad.addColorStop(0.2, '#0a2c35');
  waterGrad.addColorStop(1, '#021117');
  ctx.fillStyle = waterGrad;
  ctx.fillRect(0, horizonY, VIEW_W, VIEW_H - horizonY);

  // Dynamic Horizon Fog Blend
  const fogGrad = ctx.createLinearGradient(0, horizonY - 15, 0, horizonY + 25);
  fogGrad.addColorStop(0, 'rgba(44, 93, 115, 0.8)');
  fogGrad.addColorStop(1, 'rgba(18, 65, 77, 0)');
  ctx.fillStyle = fogGrad;
  ctx.fillRect(0, horizonY - 15, VIEW_W, 40);

  // Procedural Water Waves with Highlights
  ctx.save();
  const rippleTime = performance.now() * 0.0015;
  for (let y = horizonY + 4; y < VIEW_H; y += 6) {
    const p = (y - horizonY) / (VIEW_H - horizonY);
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.03 + p * 0.12})`;
    ctx.lineWidth = 1 + p * 1.5;
    ctx.beginPath();
    for (let x = 0; x < VIEW_W; x += 16) {
      const wave = Math.sin(x * 0.02 * (1-p) + rippleTime + y * 0.1) * (4 * p);
      if(x === 0) ctx.moveTo(x, y + wave); else ctx.lineTo(x, y + wave);
    }
    ctx.stroke();
  }
  ctx.restore();

  // 3. Shoreline & Trees Raycasting
  ctx.save();
  const fov = 1.1 / cameraZoom;
  const numRays = 140;
  const rayStep = fov / numRays;
  const startAngle = boat.heading - fov / 2;

  for(let i=0; i<numRays; i++){
    const angle = startAngle + i * rayStep;
    let dist = 20;
    while(dist < 700){
      const rx = boat.x + Math.cos(angle) * dist;
      const ry = boat.y + Math.sin(angle) * dist;
      if(!isWater(rx, ry)) break;
      dist += 12;
    }

    if(dist < 700){
      const correctedDist = dist * Math.cos(angle - boat.heading);
      const wallHeight = Math.min(VIEW_H * 0.38, (18000 / correctedDist) * cameraZoom);
      const xPos = (i / numRays) * VIEW_W;
      const colWidth = (VIEW_W / numRays) + 1;
      
      // Layered forest depth
      ctx.fillStyle = dist < 220 ? '#1b402e' : (dist < 400 ? '#122e21' : '#0c1f16');
      ctx.fillRect(xPos, horizonY - wallHeight * 0.82, colWidth, wallHeight * 0.84);
    }
  }
  ctx.restore();

  // 4. Lure & Fishing Line Projection
  const rodOrigin = {x: VIEW_W * 0.72, y: VIEW_H * 0.85};

  if(state.lurePos && (state.phase==='casting'||state.phase==='waiting'||state.phase==='strike'||state.phase==='fighting')){
    const dx = state.lurePos.x - boat.x;
    const dy = state.lurePos.y - boat.y;
    const dist = Math.hypot(dx, dy);
    let angle = Math.atan2(dy, dx) - boat.heading;
    while(angle > Math.PI) angle -= 2*Math.PI;
    while(angle < -Math.PI) angle += 2*Math.PI;

    const screenX = (VIEW_W / 2) + (angle / fov) * VIEW_W;
    const screenY = horizonY + Math.min(VIEW_H * 0.5, (180 / Math.max(20, dist)) * (VIEW_H * 0.3) * cameraZoom);

    let currentLureY = screenY;
    if(state.phase==='casting'){
      const arc = Math.sin(state.castT * Math.PI) * 120;
      currentLureY -= arc;
    }

    // High Visibility Monofilament Line
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(rodOrigin.x, rodOrigin.y);
    ctx.quadraticCurveTo((rodOrigin.x + screenX)/2, Math.min(rodOrigin.y, currentLureY) - 20, screenX, currentLureY);
    ctx.stroke();

    // Lure Splash / Render
    ctx.fillStyle = '#ffca28';
    ctx.beginPath(); ctx.arc(screenX, currentLureY, 4, 0, Math.PI*2); ctx.fill();

    if(state.phase==='waiting'){
      const pulse = (Math.sin(performance.now()/200)+1)*5;
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(screenX, currentLureY, 6 + pulse, 0, Math.PI*2); ctx.stroke();
    } else if(state.phase==='fighting'){
      // Fish Render on Hook
      const img = fishImages[state.fish];
      if(img.complete){
        ctx.save();
        const swimJitter = Math.sin(state.fishSwimPhase) * 12;
        const fishSize = 70;
        ctx.translate(screenX + swimJitter, currentLureY + 10);
        ctx.drawImage(img, -fishSize/2, -fishSize/4, fishSize, fishSize/2);
        ctx.restore();
      }
    }
  }

  // 5. Aim Arc Line
  if(state.phase==='aiming' && state.aim.active){
    ctx.strokeStyle = 'rgba(255, 202, 40, 0.9)';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(VIEW_W/2, VIEW_H*0.85);
    ctx.lineTo(state.aim.x, state.aim.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffca28';
    ctx.beginPath(); ctx.arc(state.aim.x, state.aim.y, 6, 0, Math.PI*2); ctx.fill();
  }

  // 6. Cockpit & Graphite Fishing Rod Overlay
  drawCockpit(rodOrigin);
}

function drawCockpit(rodTip){
  ctx.save();

  // Boat Deck Hull
  const deckGrad = ctx.createLinearGradient(0, VIEW_H*0.75, 0, VIEW_H);
  deckGrad.addColorStop(0, '#1c2830');
  deckGrad.addColorStop(1, '#0b1217');
  ctx.fillStyle = deckGrad;
  
  ctx.beginPath();
  ctx.moveTo(VIEW_W * 0.08, VIEW_H);
  ctx.lineTo(VIEW_W * 0.5, VIEW_H * 0.77);
  ctx.lineTo(VIEW_W * 0.92, VIEW_H);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Carbon Fiber Fishing Rod
  const rodGrad = ctx.createLinearGradient(VIEW_W * 0.88, VIEW_H, rodTip.x, rodTip.y);
  rodGrad.addColorStop(0, '#111');
  rodGrad.addColorStop(0.5, '#333');
  rodGrad.addColorStop(1, '#555');
  ctx.strokeStyle = rodGrad;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(VIEW_W * 0.88, VIEW_H);
  ctx.lineTo(rodTip.x, rodTip.y);
  ctx.stroke();

  // Metallic Line Guide
  ctx.fillStyle = '#4cc9f0';
  ctx.beginPath(); ctx.arc(rodTip.x, rodTip.y, 4, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

/* ---------- Dashboard Display 1: Sonar / Fish Finder ---------- */
function drawSonar(){
  const sCanvas = $('sonarCanvas');
  const sCtx = sCanvas.getContext('2d');
  const w = sCanvas.width, h = sCanvas.height;

  sCtx.fillStyle = '#010f0a';
  sCtx.fillRect(0,0,w,h);

  // Sonar Grid lines
  sCtx.strokeStyle = 'rgba(0,255,170,0.12)';
  sCtx.lineWidth = 1;
  for(let y=15;y<h;y+=15){
    sCtx.beginPath(); sCtx.moveTo(0,y); sCtx.lineTo(w,y); sCtx.stroke();
  }

  // Sonar Depth Line
  sCtx.strokeStyle = '#00ffaa';
  sCtx.lineWidth = 2;
  sCtx.shadowColor = '#00ffaa';
  sCtx.shadowBlur = 4;
  sCtx.beginPath();
  for(let i=0; i<sonarHistory.length; i++){
    const x = (i / sonarHistory.length) * w;
    const y = h - (sonarHistory[i] / 40) * h;
    if(i===0) sCtx.moveTo(x,y); else sCtx.lineTo(x,y);
  }
  sCtx.stroke();
  sCtx.shadowBlur = 0;

  // Fish Arch Blips
  if(hotspotNear(boat.x, boat.y) && Math.random()<0.6){
    sCtx.strokeStyle = '#ffca28';
    sCtx.lineWidth = 2;
    sCtx.beginPath();
    const fx = w * 0.7, fy = h * 0.4 + Math.sin(performance.now()*0.005)*8;
    sCtx.arc(fx, fy, 6, Math.PI*1.2, Math.PI*1.8);
    sCtx.stroke();
  }
}

/* ---------- Dashboard Display 2: Live Overview Map ---------- */
function drawOverviewMap(){
  const mCanvas = $('mapCanvas');
  const mCtx = mCanvas.getContext('2d');
  const w = mCanvas.width, h = mCanvas.height;

  mCtx.fillStyle = '#041410';
  mCtx.fillRect(0,0,w,h);

  const scaleX = w / WORLD_W;
  const scaleY = h / WORLD_H;

  // Lake Silhouette
  mCtx.fillStyle = '#083c48';
  mCtx.beginPath();
  mCtx.moveTo(lakePts[0].x * scaleX, lakePts[0].y * scaleY);
  for(let i=1; i<lakePts.length; i++){
    mCtx.lineTo(lakePts[i].x * scaleX, lakePts[i].y * scaleY);
  }
  mCtx.closePath();
  mCtx.fill();

  // Hotspots
  hotspots.forEach(hs=>{
    mCtx.fillStyle = 'rgba(255, 202, 40, 0.35)';
    mCtx.beginPath();
    mCtx.arc(hs.x * scaleX, hs.y * scaleY, hs.r * scaleX * 0.6, 0, Math.PI*2);
    mCtx.fill();
  });

  // Boat Position & Heading Arrow
  const bx = boat.x * scaleX;
  const by = boat.y * scaleY;

  mCtx.save();
  mCtx.translate(bx, by);
  mCtx.rotate(boat.heading);

  mCtx.fillStyle = '#ff4d6d';
  mCtx.shadowColor = '#ff4d6d';
  mCtx.shadowBlur = 6;
  mCtx.beginPath();
  mCtx.moveTo(7, 0);
  mCtx.lineTo(-4, -4);
  mCtx.lineTo(-4, 4);
  mCtx.closePath();
  mCtx.fill();

  mCtx.restore();
}

/* ---------- boot ---------- */
fitCanvas();
setPhase('driving');
requestAnimationFrame(loop);
</script>
