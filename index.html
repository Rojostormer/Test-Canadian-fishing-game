<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030c10">
<title>Canadian Waters — Pro Fishing Simulation</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;background:#030c10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;min-height:100%;touch-action:pan-y;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.app{max-width:840px;margin:auto;padding:8px 0 20px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px}
h1{font-size:20px;margin:0;font-weight:900;letter-spacing:.6px;background:linear-gradient(180deg,#fff,#a5c4d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:10px;color:#7a9cb0;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.stats{text-align:right;font-weight:800;font-size:13px;color:#e2f1f8;line-height:1.3}
.stats span{color:#4cc9f0}
.card{background:rgba(20,35,45,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 12px 32px rgba(0,0,0,.4)}

/* ---- viewport / canvas ---- */
.lakeWrap{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.6);background:#020a0d;border:1px solid rgba(255,255,255,.15)}
#scene{display:block;width:100%;height:auto;touch-action:none}
.hud{position:absolute;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.badge{position:absolute;top:12px;left:12px;background:rgba(8,24,32,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px;padding:6px 12px;font-size:11px;font-weight:800;border:1px solid rgba(255,255,255,.18);color:#d1e8f2;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.spot-flag{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#ffca28,#f57c00);color:#120a00;border-radius:99px;padding:6px 16px;font-size:11px;font-weight:900;opacity:0;transition:all .3s ease;box-shadow:0 4px 16px rgba(245,124,0,.5);letter-spacing:.5px}
.spot-flag.show{opacity:1}

/* zoom & top controls */
.topRightGroup{position:absolute;top:12px;right:12px;display:flex;gap:8px;align-items:center}
.iconBtn{height:36px;padding:0 12px;border-radius:10px;background:rgba(8,24,32,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.zoomControls{position:absolute;top:56px;left:12px;display:flex;flex-direction:column;gap:8px}

/* dashboards: fish finder top right */
.dashboard{position:absolute;top:56px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.dashBox{width:115px;height:85px;background:rgba(6,18,24,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.18);border-radius:12px;overflow:hidden;position:relative;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.dashLabel{position:absolute;top:3px;left:6px;font-size:8px;font-weight:900;color:#00ffcc;letter-spacing:.6px;z-index:2;text-shadow:0 0 4px rgba(0,255,204,.5)}
.dashBox canvas{width:100%;height:100%;display:block}

/* joystick (far left bottom) */
.stick{position:absolute;left:14px;bottom:14px;width:94px;height:94px;border-radius:50%;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.25);touch-action:none;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.stick .knob{position:absolute;width:42px;height:42px;left:24px;top:24px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.3));border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 10px rgba(0,0,0,.4)}

/* action buttons */
.actionGroup{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.mainBtn{width:96px;height:46px;border-radius:14px;background:linear-gradient(135deg,#ff7b00,#e65100);color:#fff;font-weight:900;font-size:13px;border:1px solid rgba(255,255,255,.4);box-shadow:0 6px 18px rgba(230,81,0,.4);letter-spacing:.4px;cursor:pointer}
.mainBtn.reel{background:linear-gradient(135deg,#00b4d8,#0077b6);box-shadow:0 6px 18px rgba(0,119,182,.4)}
.aimHint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(8,24,32,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 18px;border-radius:99px;font-size:12px;font-weight:800;text-align:center;white-space:nowrap;border:1px solid rgba(255,255,255,.2);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.cancelAim{position:absolute;right:14px;bottom:14px;width:76px;height:46px;border-radius:14px;background:linear-gradient(135deg,#e63946,#d62828);color:#fff;font-weight:900;font-size:11px;border:1px solid rgba(255,255,255,.3);box-shadow:0 6px 18px rgba(214,40,40,.4);cursor:pointer}

/* full map overlay modal */
.mapOverlayModal{position:absolute;inset:0;background:rgba(3,12,16,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:120;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
.mapOverlayModal canvas{border-radius:16px;border:1px solid rgba(255,255,255,.2);box-shadow:0 12px 36px rgba(0,0,0,.8);max-width:100%;max-height:70vh}

/* menus & overlays */
.menuOverlay{position:absolute;inset:0;background:rgba(3,12,16,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px;margin-top:14px}
.menuGrid button{min-height:50px;font-size:12px;text-align:center}

/* fight controls */
.fightWrap{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,rgba(3,12,16,.95) 45%)}
.meterRow{display:flex;gap:12px;margin-bottom:10px}
.meterRow .m{flex:1}
.meterRow label{font-size:10px;color:#a0c4d6;font-weight:800;letter-spacing:.6px}
.bar{height:12px;background:rgba(0,0,0,.5);border-radius:99px;overflow:hidden;margin-top:4px;border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.fill{height:100%;width:20%;background:linear-gradient(90deg,#4cc9f0,#4895ef);transition:width .12s}
.fill.red{background:linear-gradient(90deg,#ff4d6d,#c9184a)}
.fightBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fightBtns button{min-height:54px;border:0;border-radius:14px;font-weight:900;font-size:14px;color:#fff;border:1px solid rgba(255,255,255,.2);cursor:pointer}
#reelBtn{background:linear-gradient(135deg,#00b4d8,#0077b6);box-shadow:0 6px 18px rgba(0,119,182,.4)}
#runBtn{background:linear-gradient(135deg,#2a9d8f,#264653);box-shadow:0 6px 18px rgba(38,70,83,.4)}
.hookPrompt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(2,10,14,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hookPrompt button{min-height:64px;min-width:180px;border:0;border-radius:99px;background:linear-gradient(135deg,#ffca28,#f57c00);color:#120a00;font-weight:900;font-size:17px;letter-spacing:.5px;box-shadow:0 8px 24px rgba(245,124,0,.5);border:2px solid rgba(255,255,255,.4);cursor:pointer}
.strikeTimer{width:180px;height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.strikeTimer i{display:block;height:100%;background:#ffca28;width:100%}

.message{font-size:15px;font-weight:800;min-height:20px;display:flex;align-items:center;justify-content:center;text-align:center}

/* tackle box controls */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,select{width:100%;min-height:48px;border:0;border-radius:14px;font-size:13px;font-weight:900;color:#fff;background:linear-gradient(135deg,#00b4d8,#0077b6);border:1px solid rgba(255,255,255,.18);cursor:pointer}
button.secondary{background:linear-gradient(135deg,#2b3a42,#1a252c)}
select{padding:0 12px;background:#1a252c;border:1px solid rgba(255,255,255,.15)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.label{font-size:11px;color:#7a9cb0;margin-bottom:6px;font-weight:700;letter-spacing:.5px}
.trophyGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:180px;overflow-y:auto;padding-right:4px}
.trophy{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px}
.hidden{display:none!important}
.result{text-align:center}
.fishImgContainer{height:120px;display:flex;align-items:center;justify-content:center;margin:10px 0}
.fishImgContainer svg{max-height:100%;max-width:80%;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6))}
.small{font-size:11px;color:#7a9cb0;line-height:1.4}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>CANADIAN WATERS</h1><div class="sub" id="currentLocationSub">Lake Superior • Ontario</div></div>
  <div class="stats">$<span id="money">100</span><br><span id="xp">0</span> XP</div>
</header>

<div class="card" style="padding:0">
  <div class="lakeWrap">
    <canvas id="scene" width="900" height="580"></canvas>
    
    <div class="hud" id="hud">
      <div class="badge" id="timeBadge">06:40 AM</div>
      <div class="spot-flag" id="spotFlag">WEED EDGE</div>

      <div class="topRightGroup">
        <button class="iconBtn" id="mapToggleBtn">MAP</button>
        <button class="iconBtn" id="homeMenuBtn">LOCATION MENU</button>
      </div>

      <!-- Zoom controls -->
      <div class="zoomControls">
        <button class="iconBtn" id="zoomInBtn" style="width:36px">+</button>
        <button class="iconBtn" id="zoomOutBtn" style="width:36px">−</button>
      </div>

      <!-- Fish Finder Sonar Dashboard -->
      <div class="dashboard">
        <div class="dashBox">
          <div class="dashLabel">FISH FINDER</div>
          <canvas id="sonarCanvas" width="115" height="85"></canvas>
        </div>
      </div>

      <!-- Driving controls (joystick on bottom-left) -->
      <div id="driveControls">
        <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
        <div class="actionGroup">
          <button class="mainBtn" id="castBtn">CAST</button>
        </div>
      </div>

      <!-- Waiting / retrieve line controls -->
      <div id="waitControls" class="hidden">
        <div id="waitOverlay" style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%)">
          <div class="message" id="waitMsg" style="background:rgba(8,24,32,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:8px 18px;border-radius:99px;border:1px solid rgba(255,255,255,.18);box-shadow:0 6px 20px rgba(0,0,0,.4)"></div>
        </div>
        <div class="actionGroup">
          <button class="mainBtn reel" id="retrieveBtn">REEL IN</button>
        </div>
      </div>

      <!-- Aiming controls -->
      <div id="aimControls" class="hidden">
        <div class="aimHint" id="aimHint">Drag on the water to aim, release to cast</div>
        <button class="cancelAim" id="cancelAimBtn">CANCEL</button>
      </div>

      <!-- Hook strike prompt -->
      <div id="hookPrompt" class="hookPrompt hidden">
        <div class="message" id="hookMsg">STRIKE!</div>
        <div class="strikeTimer"><i id="strikeBar"></i></div>
        <button id="hookBtn">SET THE HOOK</button>
      </div>

      <!-- Underwater fight controls -->
      <div id="fightWrap" class="fightWrap hidden">
        <div class="message" id="fightMsg" style="margin-bottom:6px"></div>
        <div class="meterRow">
          <div class="m"><label>LINE TENSION</label><div class="bar"><div id="tension" class="fill"></div></div></div>
          <div class="m"><label>FISH STAMINA</label><div class="bar"><div id="stamina" class="fill"></div></div></div>
        </div>
        <div class="fightBtns">
          <button id="runBtn">LET IT RUN</button>
          <button id="reelBtn">REEL IN</button>
        </div>
      </div>

      <!-- Full Interactive Map Overlay -->
      <div id="fullMapModal" class="mapOverlayModal hidden">
        <h3 style="margin:0 0 10px;font-size:16px;font-weight:900">LAKE TOPOGRAPHY MAP</h3>
        <canvas id="fullMapCanvas" width="600" height="420"></canvas>
        <button id="closeMapBtn" style="margin-top:14px;max-width:160px;min-height:40px">CLOSE MAP</button>
      </div>

      <!-- Location Menu -->
      <div id="homeMenu" class="menuOverlay hidden">
        <h2 style="margin:0 0 4px;font-size:22px;font-weight:900">ONTARIO GREAT LAKES</h2>
        <div class="small">Select a fishing region to launch your boat</div>
        <div class="menuGrid">
          <button class="secondary" onclick="switchLake('superior')">Lake Superior<br><span style="font-size:9px;color:#00ffcc">Deep • Salmon/Trout</span></button>
          <button class="secondary" onclick="switchLake('huron')">Lake Huron<br><span style="font-size:9px;color:#00ffcc">Islands • Pike/Walleye</span></button>
          <button class="secondary" onclick="switchLake('erie')">Lake Erie<br><span style="font-size:9px;color:#00ffcc">Shallow • Trophy Walleye</span></button>
          <button class="secondary" onclick="switchLake('ontario')">Lake Ontario<br><span style="font-size:9px;color:#00ffcc">Open Water • Steelhead</span></button>
        </div>
        <button id="closeMenuBtn" style="margin-top:16px;max-width:180px;min-height:40px">RESUME</button>
      </div>
    </div>
  </div>
</div>

<section class="card">
  <div class="row">
    <div>
      <div class="label">ARTIFICIAL LURE</div>
      <select id="lureSelect">
        <option value="spoon">Silver Spoon (Salmon / Trout)</option>
        <option value="jig">Green Jig (Bass / Walleye / Perch)</option>
        <option value="crank">Minnow Crank (Pike / Bass / Walleye)</option>
        <option value="topwater">Topwater Frog (Muskie / Bass)</option>
        <option value="spinner">Inline Spinner (Trout / Panfish)</option>
      </select>
    </div>
    <div>
      <div class="label">NATURAL BAIT</div>
      <select id="baitSelect">
        <option value="none">None (Lure Only)</option>
        <option value="worm">Nightcrawler Worm (Panfish / Walleye)</option>
        <option value="minnow">Live Minnow (Pike / Walleye / Bass)</option>
        <option value="roe">Salmon Roe Bag (Trout / Salmon)</option>
      </select>
    </div>
  </div>
</section>

<section id="result" class="card result hidden">
  <div class="fishImgContainer" id="fishSvgContainer"></div>
  <h2 id="fishName" style="margin:4px 0;font-weight:900">Fish</h2>
  <div id="fishStats"></div>
  <div style="height:14px"></div>
  <div class="actions">
    <button id="castAgainBtn">CAST AGAIN</button>
    <button id="backToBoatBtn" class="secondary">DRIVE BOAT</button>
  </div>
</section>

<section class="card">
  <h3 style="margin:0 0 10px;font-size:14px;letter-spacing:.4px">Ontario Record Book</h3>
  <div class="trophyGrid" id="trophyGrid"></div>
  <div class="small" style="margin-top:10px">Total fish caught: <span id="caught">0</span></div>
</section>

<script>
const $=id=>document.getElementById(id);

/* ---------- Vector SVGs for Ontario Species ---------- */
const fishSVGs = {
  bass: `<svg viewBox="0 0 200 100" width="100%" height="100%"><path d="M20,50 Q40,10 90,15 Q140,20 180,50 Q140,80 90,85 Q40,90 20,50 Z" fill="#4d6e38" stroke="#2d4220" stroke-width="3"/><path d="M180,50 L195,30 L190,50 L195,70 Z" fill="#3a522a"/><circle cx="45" cy="35" r="5" fill="#f5ad42"/><circle cx="46" cy="35" r="2" fill="#000"/></svg>`,
  pike: `<svg viewBox="0 0 220 80" width="100%" height="100%"><path d="M10,40 Q50,15 110,20 Q170,25 210,40 Q170,55 110,60 Q50,65 10,40 Z" fill="#2d503d" stroke="#16291f" stroke-width="3"/><path d="M210,40 L220,20 L215,40 L220,60 Z" fill="#1d3629"/><circle cx="30" cy="32" r="4" fill="#f5cd42"/><circle cx="31" cy="32" r="2" fill="#000"/></svg>`,
  walleye: `<svg viewBox="0 0 200 90" width="100%" height="100%"><path d="M15,45 Q45,10 95,15 Q145,20 185,45 Q145,75 95,80 Q45,80 15,45 Z" fill="#8c7038" stroke="#52401f" stroke-width="3"/><path d="M185,45 L198,25 L192,45 L198,65 Z" fill="#52401f"/><circle cx="40" cy="30" r="5" fill="#ffffff"/><circle cx="40" cy="30" r="3" fill="#88c5cc"/></svg>`,
  trout: `<svg viewBox="0 0 200 90" width="100%" height="100%"><path d="M20,45 Q50,15 100,18 Q150,20 180,45 Q150,70 100,72 Q50,75 20,45 Z" fill="#385e68" stroke="#1d3339" stroke-width="3"/><circle cx="45" cy="32" r="4" fill="#fff"/><circle cx="45" cy="32" r="2" fill="#000"/></svg>`,
  salmon: `<svg viewBox="0 0 210 90" width="100%" height="100%"><path d="M15,45 Q50,10 105,15 Q160,18 190,45 Q160,72 105,75 Q50,80 15,45 Z" fill="#4a5059" stroke="#25292e" stroke-width="3"/><circle cx="40" cy="30" r="4" fill="#f5cd42"/><circle cx="41" cy="30" r="2" fill="#000"/></svg>`,
  muskie: `<svg viewBox="0 0 230 80" width="100%" height="100%"><path d="M10,40 Q50,12 115,18 Q180,22 220,40 Q180,58 115,62 Q50,68 10,40 Z" fill="#595f39" stroke="#2c301a" stroke-width="3"/><circle cx="28" cy="30" r="4" fill="#ffca28"/><circle cx="29" cy="30" r="2" fill="#000"/></svg>`,
  perch: `<svg viewBox="0 0 180 90" width="100%" height="100%"><path d="M20,45 Q50,10 90,15 Q130,20 160,45 Q130,70 90,75 Q50,80 20,45 Z" fill="#8c8238" stroke="#47421a" stroke-width="3"/><circle cx="40" cy="32" r="4" fill="#ffca28"/><circle cx="40" cy="32" r="2" fill="#000"/></svg>`
};

/* ---------- Ontario Great Lakes Configuration ---------- */
const LAKES = {
  superior: { name: "Lake Superior", depth: 45, species: ['trout','salmon','pike','walleye'] },
  huron: { name: "Lake Huron", depth: 30, species: ['bass','pike','walleye','perch','muskie'] },
  erie: { name: "Lake Erie", depth: 18, species: ['walleye','bass','perch','crappie'] },
  ontario: { name: "Lake Ontario", depth: 38, species: ['salmon','trout','bass','walleye'] }
};
let currentLakeKey = 'superior';

/* ---------- Species Metadata & Lure/Bait Preferences ---------- */
const speciesMeta = {
  bass: { label: 'Smallmouth Bass', min: 1, max: 7, lenBase: 12, lenMul: 2.8, svg: 'bass' },
  largemouth: { label: 'Largemouth Bass', min: 1, max: 9, lenBase: 12, lenMul: 2.6, svg: 'bass' },
  pike: { label: 'Northern Pike', min: 2, max: 28, lenBase: 22, lenMul: 1.5, svg: 'pike' },
  walleye: { label: 'Walleye', min: 1.2, max: 14, lenBase: 16, lenMul: 2.1, svg: 'walleye' },
  trout: { label: 'Lake Trout', min: 3, max: 35, lenBase: 20, lenMul: 1.4, svg: 'trout' },
  salmon: { label: 'Chinook Salmon', min: 5, max: 40, lenBase: 24, lenMul: 1.2, svg: 'salmon' },
  steelhead: { label: 'Steelhead Trout', min: 2, max: 20, lenBase: 18, lenMul: 1.6, svg: 'trout' },
  muskie: { label: 'Muskellunge', min: 8, max: 55, lenBase: 30, lenMul: 1.1, svg: 'muskie' },
  perch: { label: 'Yellow Perch', min: 0.3, max: 2.2, lenBase: 7, lenMul: 3.5, svg: 'perch' },
  crappie: { label: 'Black Crappie', min: 0.4, max: 3, lenBase: 8, lenMul: 3.2, svg: 'perch' }
};

const tacklePrefs = {
  lures: {
    spoon: { salmon: 2.2, trout: 2.0, steelhead: 1.8, pike: 1.3 },
    jig: { bass: 2.0, walleye: 1.9, perch: 1.8, crappie: 1.8 },
    crank: { pike: 1.8, bass: 1.6, walleye: 1.5, largemouth: 1.7 },
    topwater: { muskie: 2.5, largemouth: 2.2, bass: 1.5, pike: 1.4 },
    spinner: { trout: 1.8, perch: 1.6, steelhead: 1.5, crappie: 1.4 }
  },
  baits: {
    none: {},
    worm: { perch: 2.2, crappie: 2.0, walleye: 1.5, bass: 1.3 },
    minnow: { walleye: 2.2, pike: 1.8, bass: 1.6, muskie: 1.4 },
    roe: { trout: 2.4, salmon: 2.5, steelhead: 2.2 }
  }
};

/* ---------- World & Environmental Features ---------- */
const WORLD_W=2200, WORLD_H=1600;
const CENTER={x:WORLD_W/2,y:WORLD_H/2};

const boat={x:CENTER.x,y:CENTER.y-250,heading:-Math.PI/2,speed:0};
let cameraZoom=1.0;
let joy={active:false,dx:0,dy:0,id:null};

const state={
  phase:'driving',
  money:100,xp:0,caught:0,
  records:{},
  fish:null,weight:0,length:0,
  tension:.2,stamina:1,
  lurePos:null, castFrom:null, castT:0,
  aim:{active:false,x:0,y:0},
  strikeDeadline:0,
  timeMinutes:6*60+40,
  underwaterFishPos:{x:0,y:0,dir:1}
};

// Lake Geometry
const baseR=560;
const lakePts=[];
for(let i=0;i<200;i++){
  const a=(i/200)*Math.PI*2;
  const r=baseR + 60*Math.sin(3*a) + 40*Math.sin(7*a);
  lakePts.push({x:CENTER.x+Math.cos(a)*r,y:CENTER.y+Math.sin(a)*r*0.82});
}

/* Natural Environmental Structure Hotspots */
const hotspots=[
  {x:CENTER.x-330,y:CENTER.y+260,r:150,name:"WEED BED",type:"weed",density:0.85},
  {x:CENTER.x+380,y:CENTER.y-260,r:140,name:"ROCKY REEF",type:"rock",density:0.90},
  {x:CENTER.x+120,y:CENTER.y+330,r:130,name:"DEEP DROP-OFF",type:"dropoff",density:0.80},
  {x:CENTER.x-220,y:CENTER.y-300,r:120,name:"BOULDER FIELD",type:"rock",density:0.75}
];

/* Collision Mask Initialization */
const maskCanvas=document.createElement('canvas');
maskCanvas.width=WORLD_W;maskCanvas.height=WORLD_H;
const mctx=maskCanvas.getContext('2d');
mctx.fillStyle='#000'; mctx.fillRect(0,0,WORLD_W,WORLD_H);
mctx.beginPath(); mctx.moveTo(lakePts[0].x,lakePts[0].y);
for(let i=1;i<lakePts.length;i++) mctx.lineTo(lakePts[i].x,lakePts[i].y);
mctx.closePath(); mctx.fillStyle='#fff'; mctx.fill();
const maskData=mctx.getImageData(0,0,WORLD_W,WORLD_H).data;

function isWater(x,y){
  if(x<0||y<0||x>=WORLD_W||y>=WORLD_H) return false;
  return maskData[((y|0)*WORLD_W+(x|0))*4]>128;
}

function getHotspotAt(x,y){
  for(const h of hotspots){ if(Math.hypot(h.x-x,h.y-y)<h.r) return h; }
  return null;
}

/* ---------- State UI Management ---------- */
const canvas=$('scene');
const ctx=canvas.getContext('2d');
let VIEW_W=900,VIEW_H=580;

function fitCanvas(){
  const w=canvas.clientWidth||900;
  const h=Math.round(w*(580/900));
  canvas.width=w; canvas.height=h;
  VIEW_W=w;VIEW_H=h;
}
window.addEventListener('resize',fitCanvas);

$('zoomInBtn').addEventListener('click',()=>cameraZoom=Math.min(2.0,cameraZoom+0.2));
$('zoomOutBtn').addEventListener('click',()=>cameraZoom=Math.max(0.6,cameraZoom-0.2));
$('homeMenuBtn').addEventListener('click',()=>$('homeMenu').classList.remove('hidden'));
$('closeMenuBtn').addEventListener('click',()=>$('homeMenu').classList.add('hidden'));

$('mapToggleBtn').addEventListener('click',()=>{
  $('fullMapModal').classList.remove('hidden');
  renderFullMap();
});
$('closeMapBtn').addEventListener('click',()=>$('fullMapModal').classList.add('hidden'));

function switchLake(key){
  currentLakeKey = key;
  const l = LAKES[key];
  $('currentLocationSub').textContent = `${l.name} • Ontario`;
  boat.x = CENTER.x; boat.y = CENTER.y - 200;
  $('homeMenu').classList.add('hidden');
  setPhase('driving');
}

function setPhase(p){
  state.phase=p;
  $('driveControls').classList.toggle('hidden',p!=='driving');
  $('aimControls').classList.toggle('hidden',p!=='aiming');
  $('waitControls').classList.toggle('hidden',!(p==='casting'||p==='waiting'));
  $('hookPrompt').classList.toggle('hidden',p!=='strike');
  $('fightWrap').classList.toggle('hidden',p!=='fighting');
  $('result').classList.toggle('hidden',p!=='landed');
}

/* ---------- Steering & Joystick Input Controls ---------- */
const stickEl=$('stick'), knobEl=$('knob');
function stickCenter(){
  const r=stickEl.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2,radius:r.width/2};
}
function setKnob(dx,dy){ knobEl.style.left=(24+dx)+'px'; knobEl.style.top=(24+dy)+'px'; }

stickEl.addEventListener('pointerdown',e=>{
  if(state.phase!=='driving') return;
  joy.active=true;joy.id=e.pointerId;
  stickEl.setPointerCapture(e.pointerId);
  updateStick(e);
});
stickEl.addEventListener('pointermove',e=>{ if(joy.active&&e.pointerId===joy.id) updateStick(e); });
function endStick(e){ if(joy.active&&(!e||e.pointerId===joy.id)){ joy.active=false;joy.dx=0;joy.dy=0;setKnob(0,0); } }
stickEl.addEventListener('pointerup',endStick);
stickEl.addEventListener('pointercancel',endStick);
function updateStick(e){
  const c=stickCenter();
  let dx=e.clientX-c.x, dy=e.clientY-c.y;
  const max=c.radius-6;
  const d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  joy.dx=dx/max; joy.dy=dy/max;
  setKnob(dx,dy);
}

/* Aiming Drag Controls */
let aimPointerId=null;
canvas.addEventListener('pointerdown',e=>{
  if(state.phase!=='aiming') return;
  aimPointerId=e.pointerId; canvas.setPointerCapture(e.pointerId); updateAim(e);
});
canvas.addEventListener('pointermove',e=>{ if(state.phase==='aiming'&&e.pointerId===aimPointerId) updateAim(e); });
function endAim(e){
  if(state.phase!=='aiming'||(e&&e.pointerId!==aimPointerId)) return;
  aimPointerId=null; if(state.aim.active) launchCast();
}
canvas.addEventListener('pointerup',endAim);
canvas.addEventListener('pointercancel',endAim);
function updateAim(e){
  const r=canvas.getBoundingClientRect(), scale=VIEW_W/r.width;
  state.aim.active=true; state.aim.x=(e.clientX-r.left)*scale; state.aim.y=(e.clientY-r.top)*scale;
}

$('castBtn').addEventListener('click',()=>{ if(state.phase==='driving'){ state.aim.active=false; setPhase('aiming'); } });
$('cancelAimBtn').addEventListener('click',()=>{ setPhase('driving'); });
$('retrieveBtn').addEventListener('click',()=>{ setPhase('driving'); state.lurePos=null; });
$('hookBtn').addEventListener('click',setHook);
$('reelBtn').addEventListener('click',reel);
$('runBtn').addEventListener('click',runLine);
$('castAgainBtn').addEventListener('click',()=>{ setPhase('aiming'); state.aim.active=false; });
$('backToBoatBtn').addEventListener('click',()=>{ setPhase('driving'); });

/* ---------- Advanced Realistic Fishing & Environmental Logic ---------- */
function launchCast(){
  const screenDx = state.aim.x - VIEW_W/2, screenDy = (VIEW_H*0.85) - state.aim.y;
  if(screenDy < 20){ setPhase('driving'); return; }
  const dist = Math.min(280, screenDy * (1.5 / cameraZoom));
  const angleOffset = (screenDx / (VIEW_W * 0.5)) * (0.8 / cameraZoom);
  const castAngle = boat.heading + angleOffset;

  let targetX = boat.x + Math.cos(castAngle) * dist;
  let targetY = boat.y + Math.sin(castAngle) * dist;
  if(!isWater(targetX, targetY)){ setPhase('driving'); return; }

  state.castFrom = {x:boat.x, y:boat.y};
  state.lurePos = {x:targetX, y:targetY};
  state.castT = 0;
  setPhase('casting');
  $('waitMsg').textContent = 'Casting line...';
}

function processWaterWaiting(dt){
  state.waitTimer -= dt;
  if(state.waitTimer <= 0){
    // Calculate bite probability based on environmental variables
    const spot = getHotspotAt(state.lurePos.x, state.lurePos.y);
    let biteChance = 0.12; // Base open water chance

    if(spot) biteChance += spot.density * 0.55; // Structure bonus
    
    // Time of day bonus (Dawn/Dusk boost)
    const hour = Math.floor(state.timeMinutes / 60);
    if(hour >= 5 && hour <= 8) biteChance += 0.20;

    if(Math.random() < biteChance){
      triggerStrike();
    } else {
      // Skunk / No Fish Bite
      const missedMsgs = ["No bites nearby...", "Lure drifted past...", "Fish ignored the bait...", "Quiet waters..."];
      $('waitMsg').textContent = missedMsgs[Math.floor(Math.random() * missedMsgs.length)];
      setTimeout(()=>{ if(state.phase === 'waiting') setPhase('driving'); }, 1400);
    }
  }
}

function triggerStrike(){
  const lake = LAKES[currentLakeKey];
  const activeLure = $('lureSelect').value;
  const activeBait = $('baitSelect').value;

  const lureMods = tacklePrefs.lures[activeLure] || {};
  const baitMods = tacklePrefs.baits[activeBait] || {};

  let totalWeight = 0;
  const pool = lake.species.map(s => {
    let weight = 1.0;
    if(lureMods[s]) weight *= lureMods[s];
    if(baitMods[s]) weight *= baitMods[s];
    totalWeight += weight;
    return { species: s, weight: totalWeight };
  });

  const roll = Math.random() * totalWeight;
  const picked = pool.find(p => roll <= p.weight)?.species || lake.species[0];
  
  const meta = speciesMeta[picked];
  state.fish = picked;
  state.weight = +(meta.min + Math.pow(Math.random(), 1.8) * (meta.max - meta.min)).toFixed(2);
  state.length = Math.round(meta.lenBase + state.weight * meta.lenMul + (Math.random()*4-2));
  state.strikeDeadline = 1.3;
  
  setPhase('strike');
  $('hookMsg').textContent = 'STRIKE!';
}

function setHook(){
  if(state.phase!=='strike') return;
  state.tension=.3; state.stamina=1.0;
  state.underwaterFishPos = { x: VIEW_W * 0.65, y: VIEW_H * 0.5, dir: -1 };
  setPhase('fighting');
  $('fightMsg').textContent='Fish Hooked! Fight!';
}

function reel(){
  if(state.phase!=='fighting') return;
  state.tension = Math.min(1, state.tension + .05 + Math.random()*.07);
  state.stamina = Math.max(0, state.stamina - (.05 + Math.random()*.06));
  state.underwaterFishPos.x -= 12; // Pull towards boat
  
  if(state.tension >= 1){
    $('fightMsg').textContent = 'Line snapped!';
    setTimeout(()=>setPhase('driving'), 800);
    return;
  }
  if(state.stamina <= 0 || state.underwaterFishPos.x <= VIEW_W * 0.22){ land(); return; }
  $('fightMsg').textContent = state.tension > .8 ? 'CRITICAL TENSION!' : 'Reeling in...';
}

function runLine(){
  if(state.phase!=='fighting') return;
  state.tension = Math.max(.1, state.tension - (.15 + Math.random()*.1));
  state.stamina = Math.max(0, state.stamina - (.01 + Math.random()*.02));
  state.underwaterFishPos.x += 18; // Fish pulls away
}

function land(){
  state.caught++;
  const reward = Math.floor(state.weight * 7), gain = Math.floor(state.weight * 10);
  state.money += reward; state.xp += gain;
  
  if(!state.records[state.fish] || state.weight > state.records[state.fish]){
    state.records[state.fish] = state.weight;
  }
  
  const meta = speciesMeta[state.fish];
  $('fishSvgContainer').innerHTML = fishSVGs[meta.svg] || fishSVGs.bass;
  $('fishName').textContent = meta.label;
  $('fishStats').innerHTML = `<strong>${state.weight.toFixed(2)} lb</strong> • ${state.length} in<br><span class="small">+$${reward} credits • +${gain} XP</span>`;
  renderRecords();
  setPhase('landed');
}

function renderRecords(){
  const grid = $('trophyGrid');
  grid.innerHTML = '';
  Object.keys(speciesMeta).forEach(key => {
    const meta = speciesMeta[key];
    const rec = state.records[key];
    const div = document.createElement('div');
    div.className = 'trophy';
    div.innerHTML = `<span>${meta.label}</span><strong>${rec ? rec.toFixed(2)+' lb' : '—'}</strong>`;
    grid.appendChild(div);
  });
}

/* ---------- Main Game Loop & Dynamic Renderers ---------- */
const sonarHistory = new Array(80).fill(0);
let lastT = performance.now();

function loop(now){
  const dt = Math.min(.05, (now - lastT) / 1000);
  lastT = now;
  update(dt);

  if(state.phase === 'fighting'){
    drawUnderwaterFightView();
  } else {
    drawFirstPerson();
  }

  drawSonar();
  requestAnimationFrame(loop);
}

function update(dt){
  if(state.phase === 'driving'){
    const mag = Math.hypot(joy.dx, joy.dy);
    if(mag > .12){
      boat.heading += joy.dx * 1.8 * dt;
      boat.speed += (-joy.dy * 140 - boat.speed) * dt * 3.0;
    } else {
      boat.speed += (0 - boat.speed) * dt * 2.0;
    }
    const nx = boat.x + Math.cos(boat.heading) * boat.speed * dt;
    const ny = boat.y + Math.sin(boat.heading) * boat.speed * dt;
    if(isWater(nx, ny)){ boat.x = nx; boat.y = ny; } else { boat.speed = -boat.speed * 0.3; }
  }

  if(state.phase === 'casting'){
    state.castT += dt / 0.6;
    if(state.castT >= 1){
      setPhase('waiting');
      state.waitTimer = 1.8 + Math.random() * 2.5;
      $('waitMsg').textContent = 'Lure set. Waiting for bites...';
    }
  } else if(state.phase === 'waiting'){
    processWaterWaiting(dt);
  } else if(state.phase === 'strike'){
    state.strikeDeadline -= dt;
    $('strikeBar').style.width = Math.max(0, (state.strikeDeadline / 1.3) * 100) + '%';
    if(state.strikeDeadline <= 0) setPhase('driving');
  } else if(state.phase === 'fighting'){
    // Fish movement wiggle
    state.underwaterFishPos.y += Math.sin(performance.now() * 0.008) * 1.2;
  }

  // Sonar Data Processing
  const spot = getHotspotAt(boat.x, boat.y);
  sonarHistory.shift();
  if(spot && Math.random() < spot.density){
    sonarHistory.push(1); // Fish detected arc
  } else {
    sonarHistory.push(0); // Clear water
  }

  // UI Updates
  $('money').textContent = state.money;
  $('xp').textContent = state.xp;
  $('caught').textContent = state.caught;
  $('tension').style.width = (state.tension * 100) + '%';
  $('tension').className = 'fill ' + (state.tension > .8 ? 'red' : '');
  $('stamina').style.width = (state.stamina * 100) + '%';

  const hs = getHotspotAt(boat.x, boat.y);
  $('spotFlag').classList.toggle('show', !!hs && state.phase === 'driving');
  if(hs) $('spotFlag').textContent = hs.name;
}

/* ---------- Render First-Person View & Underwater Fight View ---------- */
function drawFirstPerson(){
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);

  // Horizon & Sky Gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, VIEW_H * 0.45);
  skyGrad.addColorStop(0, '#04151f'); skyGrad.addColorStop(1, '#2c5d73');
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, VIEW_W, VIEW_H * 0.45);

  const horizonY = VIEW_H * 0.42;
  const waterGrad = ctx.createLinearGradient(0, horizonY, 0, VIEW_H);
  waterGrad.addColorStop(0, '#12414d'); waterGrad.addColorStop(1, '#021117');
  ctx.fillStyle = waterGrad; ctx.fillRect(0, horizonY, VIEW_W, VIEW_H - horizonY);

  // Raycasted Shoreline
  const fov = 1.1 / cameraZoom, numRays = 120, rayStep = fov / numRays;
  const startAngle = boat.heading - fov / 2;
  ctx.fillStyle = '#122e21';
  for(let i=0; i<numRays; i++){
    const angle = startAngle + i * rayStep;
    let dist = 20;
    while(dist < 650){
      if(!isWater(boat.x + Math.cos(angle)*dist, boat.y + Math.sin(angle)*dist)) break;
      dist += 14;
    }
    if(dist < 650){
      const wallHeight = Math.min(VIEW_H * 0.35, (16000 / (dist * Math.cos(angle - boat.heading))) * cameraZoom);
      ctx.fillRect((i / numRays) * VIEW_W, horizonY - wallHeight * 0.8, (VIEW_W / numRays) + 1, wallHeight * 0.82);
    }
  }

  // Aiming Line
  if(state.phase === 'aiming' && state.aim.active){
    ctx.strokeStyle = '#ffca28'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(VIEW_W / 2, VIEW_H * 0.85); ctx.lineTo(state.aim.x, state.aim.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // Boat Dashboard Line
  ctx.fillStyle = '#111820';
  ctx.beginPath(); ctx.moveTo(VIEW_W * 0.1, VIEW_H); ctx.lineTo(VIEW_W * 0.5, VIEW_H * 0.78); ctx.lineTo(VIEW_W * 0.9, VIEW_H); ctx.fill();
}

function drawUnderwaterFightView(){
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);

  // Deep Underwater Environment
  const bgGrad = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  bgGrad.addColorStop(0, '#063847');
  bgGrad.addColorStop(0.7, '#021e28');
  bgGrad.addColorStop(1, '#010d12');
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // Sun Rays Effect
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  for(let i=0; i<5; i++){
    ctx.beginPath();
    ctx.moveTo(VIEW_W*0.1 + i*160, 0);
    ctx.lineTo(VIEW_W*0.2 + i*160, 0);
    ctx.lineTo(VIEW_W*0.3 + i*180, VIEW_H);
    ctx.lineTo(VIEW_W*0.15 + i*180, VIEW_H);
    ctx.fill();
  }

  // Lakebed / Seabed
  ctx.fillStyle = '#091512';
  ctx.beginPath();
  ctx.moveTo(0, VIEW_H * 0.82);
  ctx.quadraticCurveTo(VIEW_W*0.4, VIEW_H*0.75, VIEW_W, VIEW_H*0.85);
  ctx.lineTo(VIEW_W, VIEW_H); ctx.lineTo(0, VIEW_H); ctx.fill();

  // Draw Environmental Rocks & Weed Obstacles
  const hs = getHotspotAt(boat.x, boat.y);
  if(hs && hs.type === 'weed'){
    ctx.fillStyle = '#1a4a28';
    for(let x=40; x<VIEW_W; x+=70){
      ctx.fillRect(x, VIEW_H*0.6, 12, VIEW_H*0.3);
    }
  } else if(hs && hs.type === 'rock'){
    ctx.fillStyle = '#2c393f';
    ctx.beginPath(); ctx.arc(VIEW_W*0.3, VIEW_H*0.82, 45, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(VIEW_W*0.7, VIEW_H*0.85, 60, 0, Math.PI*2); ctx.fill();
  }

  // Fishing Line to Hooked Fish
  ctx.strokeStyle = state.tension > 0.8 ? '#ff4d6d' : 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, VIEW_H * 0.1);
  ctx.lineTo(state.underwaterFishPos.x, state.underwaterFishPos.y);
  ctx.stroke();

  // Fish Icon/Silhouette Struggling
  ctx.save();
  ctx.translate(state.underwaterFishPos.x, state.underwaterFishPos.y);
  ctx.scale(0.8, 0.8);
  const meta = speciesMeta[state.fish];
  const svgStr = fishSVGs[meta ? meta.svg : 'bass'];
  const img = new Image();
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svgStr);
  ctx.drawImage(img, -60, -30, 120, 60);
  ctx.restore();
}

/* ---------- Sonar & Full Topo Map Rendering ---------- */
function drawSonar(){
  const sCanvas = $('sonarCanvas'), sCtx = sCanvas.getContext('2d');
  const w = sCanvas.width, h = sCanvas.height;
  sCtx.fillStyle = '#010f0a'; sCtx.fillRect(0, 0, w, h);

  const lakeDepth = LAKES[currentLakeKey].depth;
  sCtx.strokeStyle = 'rgba(0,255,170,0.2)';
  sCtx.strokeRect(2, 2, w-4, h-4);

  // Draw Sonar Arcs only where fish probability exists
  for(let i=0; i<sonarHistory.length; i++){
    if(sonarHistory[i] === 1){
      const x = (i / sonarHistory.length) * w;
      const y = h * 0.45 + Math.sin(i * 0.3) * 10;
      sCtx.strokeStyle = '#00ffcc';
      sCtx.lineWidth = 2;
      sCtx.beginPath();
      sCtx.arc(x, y, 6, Math.PI * 1.1, Math.PI * 1.9);
      sCtx.stroke();
    }
  }
}

function renderFullMap(){
  const mCanvas = $('fullMapCanvas'), mCtx = mCanvas.getContext('2d');
  const w = mCanvas.width, h = mCanvas.height;
  mCtx.fillStyle = '#020d12'; mCtx.fillRect(0, 0, w, h);

  const sx = w / WORLD_W, sy = h / WORLD_H;

  // Render Water Body
  mCtx.fillStyle = '#083c48';
  mCtx.beginPath();
  mCtx.moveTo(lakePts[0].x * sx, lakePts[0].y * sy);
  for(let i=1; i<lakePts.length; i++) mCtx.lineTo(lakePts[i].x * sx, lakePts[i].y * sy);
  mCtx.fill();

  // Render Environmental Hotspots (Weeds, Drop-offs, Rocks)
  for(const hs of hotspots){
    mCtx.fillStyle = hs.type === 'weed' ? 'rgba(46,125,50,0.45)' : hs.type === 'rock' ? 'rgba(120,144,156,0.45)' : 'rgba(2,119,189,0.45)';
    mCtx.beginPath();
    mCtx.arc(hs.x * sx, hs.y * sy, hs.r * sx, 0, Math.PI * 2);
    mCtx.fill();
    mCtx.fillStyle = '#fff';
    mCtx.font = '9px sans-serif';
    mCtx.fillText(hs.name, (hs.x - 30) * sx, hs.y * sy);
  }

  // Render Boat Marker
  mCtx.fillStyle = '#ff4d6d';
  mCtx.beginPath();
  mCtx.arc(boat.x * sx, boat.y * sy, 6, 0, Math.PI * 2);
  mCtx.fill();
}

/* ---------- Game Initialization ---------- */
fitCanvas();
renderRecords();
setPhase('driving');
requestAnimationFrame(loop);
</script>
